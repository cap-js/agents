# Agent status messages (shown during task execution)
#XMSG Status info message send to the user client when a tool is called. {0} = tool name
agent_status_calling_tools=Apelare {0}
#XMSG Status info message send to the user client when an entity is being queried. {0} = entity name
agent_status_querying=Interogare {0}
#XMSG Status info message send to the user client after a tool result returned and the agent is processing it
agent_status_processing_response=Se prelucrează răspunsul instrumentului
#XMSG Status info message send to the user client after multiple tool results returned and the agent is processing it
agent_status_processing_responses=Se prelucrează răspunsurile instrumentului
agent_status_summarizing_progress=Agent întrerupt. Se rezumă progresul.
AGENT_SUMMARY_QUOTA_FALLBACK=Sarcina a fost oprită deoarece a atins limita de consum resurse. Este posibil ca unele lucrări să fi fost efectuate – verificați rezultatele sau reîncercați cu o cerere mai simplă.
AGENT_SUMMARY_TIMEOUT_FALLBACK=Sarcina a fost oprită deoarece și-a atins limita de timp. Este posibil ca progresul să fie incomplet. Continuați execuția sau opriți?

# Authentication
#XMSG Error message for HTTP 401 status
UNAUTHORIZED=Neautorizat
#XMSG Error message for HTTP 403 status
FORBIDDEN=Interzis

# Input validation
#XMSG Error message send to the users client when their message exceeds the limit. {0} = number of allowed characters
MESSAGE_TOO_LONG=Un mesaj nu trebuie să depășească {0} caractere.

# Quota enforcement
QUOTA_CONCURRENT_TASKS=Numărul maxim de {0} sarcini simultane a fost atins. Încercați din nou mai târziu.
QUOTA_CONCURRENT_TASKS_PER_USER=Numărul maxim de {0} sarcini simultane per utilizator a fost atins. Încercați din nou mai târziu.
QUOTA_TASKS_PER_HOUR=Numărul maxim de {0} sarcini per oră pentru acest tenant a fost atins. Încercați din nou mai târziu.
QUOTA_TASKS_PER_HOUR_PER_USER=Numărul maxim de {0} sarcini per oră per utilizator a fost atins. Încercați din nou mai târziu.
QUOTA_TOOL_CALLS_PER_HOUR=A fost utilizată cantitatea maximă de apeluri de instrumente per oră ({0}). Încercați din nou mai târziu.
QUOTA_LLM_TOKENS_PER_DAY=Numărul maxim de tokenuri LLM pentru astăzi a fost deja utilizat ({0}). Încercați din nou mâine.

# Content filter
CONTENT_FILTER_BLOCKED=Intrarea dvs. a fost blocată de filtrul de siguranță al conținutului. Vă rugăm să reformulați.
CONTENT_FILTER_UNAVAILABLE=Verificarea siguranței conținutului este indisponibilă temporar. Încercați din nou.
CONTENT_FILTER_TOOL_BLOCKED=Ultimul instrument apelat a dat un rezultat rău intenționat. Încercați o direcție diferită pentru a evita aceleași date malițioase.

# Push notifications
PUSH_URL_NOT_ALLOWED=URL ''{0}'' apel de retur pentru notificarea push nu este în domenii permise: {1}

# HITL
HITL_APPROVE=Aprobare
HITL_REJECT=Respingere
HITL_CONTINUE=Continuare
HITL_STOP=Oprire
RESUME_REQUIRES_TEXT=Mesajul de reluare trebuie să conțină text (de ex. ''aprobare'' sau ''respingere'') sau o parte de date.

# LLM
LLM_UNAVAILABLE=Agentul este indisponibil temporar. Încercați din nou mai târziu.
