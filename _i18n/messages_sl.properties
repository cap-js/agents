# Agent status messages (shown during task execution)
#XMSG Status info message send to the user client when a tool is called. {0} = tool name
agent_status_calling_tools=Klicanje {0}
#XMSG Status info message send to the user client when an entity is being queried. {0} = entity name
agent_status_querying=Poizvedovanje {0}
#XMSG Status info message send to the user client after a tool result returned and the agent is processing it
agent_status_processing_response=Obdelava odziva orodja
#XMSG Status info message send to the user client after multiple tool results returned and the agent is processing it
agent_status_processing_responses=Obdelava odzivov orodja
agent_status_summarizing_progress=Referent prekinjen. Povzetek napredka.
AGENT_SUMMARY_QUOTA_FALLBACK=Naloga je zaustavljena, ko je dosegla omejitev porabe resursov. Del naloge je morda že bil opravljen – preverite rezultate ali poskusite znova z enostavnejšo zahtevo.
AGENT_SUMMARY_TIMEOUT_FALLBACK=Naloga je bila zaustavljena, ko je dosegla svojo časovno omejitev. Napredek je morda nepopoln. Želite nadaljevati izvajanje ali zaustaviti?

# Authentication
#XMSG Error message for HTTP 401 status
UNAUTHORIZED=Nepooblaščeno
#XMSG Error message for HTTP 403 status
FORBIDDEN=Prepovedano

# Input validation
#XMSG Error message send to the users client when their message exceeds the limit. {0} = number of allowed characters
MESSAGE_TOO_LONG=Sporočilo ne sme presegati {0} znakov.

# Quota enforcement
QUOTA_CONCURRENT_TASKS=Doseženo je največje število {0} hkratnih nalog. Poskusite znova pozneje.
QUOTA_CONCURRENT_TASKS_PER_USER=Doseženo je največje število {0} hkratnih nalog na uporabnika. Poskusite znova pozneje.
QUOTA_TASKS_PER_HOUR=Doseženo je največje število {0} nalog na uro za tega najemnika. Poskusite znova pozneje.
QUOTA_TASKS_PER_HOUR_PER_USER=Doseženo je največje število {0} nalog na uro na uporabnika. Poskusite znova pozneje.
QUOTA_TOOL_CALLS_PER_HOUR=Uporabljeno je bilo največje število priklicev orodja na uro ({0}). Poskusite znova pozneje.
QUOTA_LLM_TOKENS_PER_DAY=Največje število žetonov LLM za danes je že porabljeno ({0}). Poskusite znova jutri.

# Content filter
CONTENT_FILTER_BLOCKED=Vaš vnos je blokiral filter za varnost vsebine. Ubesedite drugače.
CONTENT_FILTER_UNAVAILABLE=Preverjanje varnosti vsebine začasno ni na voljo. Poskusite znova.
CONTENT_FILTER_TOOL_BLOCKED=Zadnje priklicano orodje je prineslo zlonamerni rezultat. Poskusite z drugačnim pristopm, da se izognete istim zlonamernim podatkom.

# Push notifications
PUSH_URL_NOT_ALLOWED=URL povratnega klica potisnega obvestila ''{0}'' ni v dovoljenih domenah: {1}

# HITL
HITL_APPROVE=Odobritev
HITL_REJECT=Zavrnitev
HITL_CONTINUE=Naprej
HITL_STOP=Zaustavitev
RESUME_REQUIRES_TEXT=Sporočilo za nadaljevanje mora vsebovati besedilo (npr. ''odobritev'' ali ''zavrnitev'') ali del podatkov.

# LLM
LLM_UNAVAILABLE=Referent začasno ni na voljo. Poskusite znova pozneje.
