HITL_APPROVE=อนุมัติ
HITL_REJECT=ปฏิเสธ
HITL_CONTINUE=ดำเนินการต่อ
HITL_STOP=หยุด
RESUME_REQUIRES_TEXT=ข้อความประวัติย่อต้องมีข้อความ (เช่น ''อนุมัติ'' หรือ ''ปฏิเสธ'') หรือส่วนข้อมูล

# LLM
LLM_UNAVAILABLE=เอเจนต์ไม่พร้อมใช้งานชั่วคราว กรุณาลองอีกครั้งภายหลัง
