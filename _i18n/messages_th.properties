# Agent status messages (shown during task execution)
#XMSG Status info message send to the user client when a tool is called. {0} = tool name
agent_status_calling_tools=กำลังเรียก {0}
#XMSG Status info message send to the user client when an entity is being queried. {0} = entity name
agent_status_querying=กำลังสืบค้น {0}
#XMSG Status info message send to the user client after a tool result returned and the agent is processing it
agent_status_processing_response=กำลังประมวลผลการตอบกลับของเครื่องมือ
#XMSG Status info message send to the user client after multiple tool results returned and the agent is processing it
agent_status_processing_responses=กำลังประมวลผลการตอบกลับของเครื่องมือ
agent_status_summarizing_progress=เอเจนต์ถูกขัดจังหวะ กำลังสรุปความคืบหน้า
AGENT_SUMMARY_QUOTA_FALLBACK=งานหยุดลงเนื่องจากถึงขีดจำกัดการใช้ทรัพยากรแล้ว งานบางอย่างอาจเสร็จสิ้นแล้ว กรุณาตรวจสอบผลลัพธ์ หรือลองใหม่ด้วยคำขอที่เรียบง่ายขึ้น
AGENT_SUMMARY_TIMEOUT_FALLBACK=งานหยุดลงเนื่องจากถึงขีดจำกัดเวลาแล้ว ความคืบหน้าอาจไม่สมบูรณ์ ดำเนินการต่อหรือหยุด?

# Authentication
#XMSG Error message for HTTP 401 status
UNAUTHORIZED=ไม่มีสิทธิ
#XMSG Error message for HTTP 403 status
FORBIDDEN=ไม่อนุญาต

# Input validation
#XMSG Error message send to the users client when their message exceeds the limit. {0} = number of allowed characters
MESSAGE_TOO_LONG=ข้อความต้องไม่เกิน {0} อักขระ

# Quota enforcement
QUOTA_CONCURRENT_TASKS=งานที่เกิดขึ้นพร้อมกันถึงจำนวนสูงสุดที่ {0} งานแล้ว กรุณาลองอีกครั้งภายหลัง
QUOTA_CONCURRENT_TASKS_PER_USER=งานที่เกิดขึ้นพร้อมกันถึงจำนวนสูงสุดที่ {0} งานต่อผู้ใช้แล้ว กรุณาลองอีกครั้งภายหลัง
QUOTA_TASKS_PER_HOUR=งานถึงจำนวนสูงสุดที่ {0} งานต่อชั่วโมงสำหรับ Tenant นี้แล้ว กรุณาลองอีกครั้งภายหลัง
QUOTA_TASKS_PER_HOUR_PER_USER=งานถึงจำนวนสูงสุดที่ {0} งานต่อชั่วโมงต่อผู้ใช้แล้ว กรุณาลองอีกครั้งภายหลัง
QUOTA_TOOL_CALLS_PER_HOUR=มีการใช้การเรียกเครื่องมือถึงจำนวนสูงสุดต่อชั่วโมงแล้ว ({0}) กรุณาลองอีกครั้งภายหลัง
QUOTA_LLM_TOKENS_PER_DAY=จำนวนเงินสูงสุดของ LLM Token สำหรับวันนี้ถูกใช้ไปแล้ว ({0}) กรุณาลองอีกครั้งในวันพรุ่งนี้

# Content filter
CONTENT_FILTER_BLOCKED=อินพุทของคุณถูกบล็อคโดยฟิลเตอร์ความปลอดภัยของเนื้อหา กรุณาปรับใหม่
CONTENT_FILTER_UNAVAILABLE=การตรวจสอบความปลอดภัยของเนื้อหาไม่พร้อมใช้งานชั่วคราว กรุณาลองอีกครั้ง
CONTENT_FILTER_TOOL_BLOCKED=เครื่องมือล่าสุดที่เรียกให้ผลลัพธ์ที่เป็นอันตราย กรุณาลองใช้วิธีการอื่นเพื่อหลีกเลี่ยงข้อมูลอันตรายในลักษณะเดียวกันนี้

# Push notifications
PUSH_URL_NOT_ALLOWED=URL การเรียกกลับการแจ้งแบบ Push ''{0}'' ไม่อยู่ในโดเมนที่อนุญาต: {1}

