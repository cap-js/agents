# Agent status messages (shown during task execution)
#XMSG Status info message send to the user client when a tool is called. {0} = tool name
agent_status_calling_tools=Pozivanje {0}
#XMSG Status info message send to the user client when an entity is being queried. {0} = entity name
agent_status_querying=Izvršavanje upita {0}
#XMSG Status info message send to the user client after a tool result returned and the agent is processing it
agent_status_processing_response=Odgovor alata obrade
#XMSG Status info message send to the user client after multiple tool results returned and the agent is processing it
agent_status_processing_responses=Odgovori alata obrade
agent_status_summarizing_progress=Referent prekinut. Rezimiranje napretka.
AGENT_SUMMARY_QUOTA_FALLBACK=Zadatak je prekinut jer je dostigao ograničenje potrošnje resursa. Neki poslovi su možda završeni — proverite rezultate ili pokušajte ponovo s jednostavnijim zahtevom.
AGENT_SUMMARY_TIMEOUT_FALLBACK=Zadatak je prekinut jer je dostigao vremensko ograničenje. Napredak može biti nepotpun. Nastaviti s izvođenjem ili prekidom?

# Authentication
#XMSG Error message for HTTP 401 status
UNAUTHORIZED=Neovlašćeno
#XMSG Error message for HTTP 403 status
FORBIDDEN=Zabranjeno

# Input validation
#XMSG Error message send to the users client when their message exceeds the limit. {0} = number of allowed characters
MESSAGE_TOO_LONG=Poruka ne sme da prekorači {0} znakova.

# Quota enforcement
QUOTA_CONCURRENT_TASKS=Dostignut je maksimum od {0} istovremenih zadataka. Pokušajte ponovo kasnije.
QUOTA_CONCURRENT_TASKS_PER_USER=Dostignut je maksimum od {0} istovremenih zadataka po korisniku. Pokušajte ponovo kasnije.
QUOTA_TASKS_PER_HOUR=Dostignut je maksimum od {0} zadataka po satu za ovog korisnika. Pokušajte ponovo kasnije.
QUOTA_TASKS_PER_HOUR_PER_USER=Dostignut je maksimum od {0} zadataka po satu po korisniku. Pokušajte ponovo kasnije.
QUOTA_TOOL_CALLS_PER_HOUR=Iskorišćena je maksimalna količina poziva alata po satu ({0}). Pokušajte ponovo kasnije.
QUOTA_LLM_TOKENS_PER_DAY=Maksimalna količina LLM tokena za danas je već iskorištena ({0}). Pokušajte ponovo sutra.

# Content filter
CONTENT_FILTER_BLOCKED=Filter bezbednosti sadržaja je blokirao vaš unos. Preformulišite.
CONTENT_FILTER_UNAVAILABLE=Provera bezbednosti sadržaja je privremeno nedostupna. Pokušajte ponovo.
CONTENT_FILTER_TOOL_BLOCKED=Poslednji alat koji je pozvan dao je zlonameran rezultat. Pokušajte s drugim smerom da biste izbegli iste zlonamerne podatke.

# Push notifications
PUSH_URL_NOT_ALLOWED=URL povratnog poziva push obaveštenja „{0}” nije u dozvoljenim domenima: {1}

# HITL
HITL_APPROVE=Odobri
HITL_REJECT=Odbij
HITL_CONTINUE=Nastavi
HITL_STOP=Prekini
RESUME_REQUIRES_TEXT=Poruka nastavka mora sadržati tekst (npr. „odobri” ili „odbij”) ili deo podataka.

# LLM
LLM_UNAVAILABLE=Referent je privremeno nedostupan. Pokušajte ponovo kasnije.
