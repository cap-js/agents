# Agent status messages (shown during task execution)
#XMSG Status info message send to the user client when a tool is called. {0} = tool name
agent_status_calling_tools=正在呼叫 {0}
#XMSG Status info message send to the user client when an entity is being queried. {0} = entity name
agent_status_querying=正在查詢 {0}
#XMSG Status info message send to the user client after a tool result returned and the agent is processing it
agent_status_processing_response=正在處理工具回應
#XMSG Status info message send to the user client after multiple tool results returned and the agent is processing it
agent_status_processing_responses=正在處理工具回應
agent_status_summarizing_progress=已中斷代理程式；正在彙總進度。
AGENT_SUMMARY_QUOTA_FALLBACK=由於工作細項已到達資源耗用限制，因此已停止。可能已完成部份工作 - 請查看結果或使用較簡單的請求重試。
AGENT_SUMMARY_TIMEOUT_FALLBACK=由於工作細項已到達時間限制，因此已停止。進度可能不完整，要繼續執行或停止？

# Authentication
#XMSG Error message for HTTP 401 status
UNAUTHORIZED=未授權
#XMSG Error message for HTTP 403 status
FORBIDDEN=已禁止

# Input validation
#XMSG Error message send to the users client when their message exceeds the limit. {0} = number of allowed characters
MESSAGE_TOO_LONG=訊息不可超過 {0} 個字元。

# Quota enforcement
QUOTA_CONCURRENT_TASKS=已達到 {0} 個同時工作細項上限，請稍後再試一次。
QUOTA_CONCURRENT_TASKS_PER_USER=已達到每位使用者 {0} 個同時工作細項上限，請稍後再試一次。
QUOTA_TASKS_PER_HOUR=此租用戶已達到每小時 {0} 個工作細項上限，請稍後再試一次。
QUOTA_TASKS_PER_HOUR_PER_USER=已達到每位使用者每小時 {0} 個工作細項上限，請稍後再試一次。
QUOTA_TOOL_CALLS_PER_HOUR=已使用每小時的工具呼叫數量上限 ({0})，請稍後再試一次。
QUOTA_LLM_TOKENS_PER_DAY=已使用今天的 LLM 權杖數量上限 ({0})，請明天再試一次。

# Content filter
CONTENT_FILTER_BLOCKED=內容安全篩選已凍結您的輸入，請重新撰寫。
CONTENT_FILTER_UNAVAILABLE=內容安全檢查暫時無法使用，請再試一次。
CONTENT_FILTER_TOOL_BLOCKED=上次呼叫的工具產生惡意結果，請嘗試不同方向以避免相同惡意資料。

# Push notifications
PUSH_URL_NOT_ALLOWED=推送通知回呼 URL ''{0}'' 不在允許的網域中：{1}

# HITL
HITL_APPROVE=核准
HITL_REJECT=拒絕
HITL_CONTINUE=繼續
HITL_STOP=停止
RESUME_REQUIRES_TEXT=繼續訊息必須包含文字 (例如：''核准'' 或 ''拒絕'') 或資料部份。

# LLM
LLM_UNAVAILABLE=代理程式暫時無法使用，請稍後再試一次。
