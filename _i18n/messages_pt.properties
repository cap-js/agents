# Agent status messages (shown during task execution)
#XMSG Status info message send to the user client when a tool is called. {0} = tool name
agent_status_calling_tools=Chamando {0}
#XMSG Status info message send to the user client when an entity is being queried. {0} = entity name
agent_status_querying=Consultando {0}
#XMSG Status info message send to the user client after a tool result returned and the agent is processing it
agent_status_processing_response=Processando resposta da ferramenta
#XMSG Status info message send to the user client after multiple tool results returned and the agent is processing it
agent_status_processing_responses=Processando respostas da ferramenta
agent_status_summarizing_progress=Agente interrompido. Resumindo o progresso.
AGENT_SUMMARY_QUOTA_FALLBACK=A tarefa foi interrompida porque atingiu o limite de consumo de recursos. Parte do trabalho pode já ter sido feito — verifique os resultados ou tente novamente com uma solicitação mais simples.
AGENT_SUMMARY_TIMEOUT_FALLBACK=A tarefa foi interrompida porque atingiu o limite de tempo. O progresso pode estar incompleto. Continuar a execução ou parar?

# Authentication
#XMSG Error message for HTTP 401 status
UNAUTHORIZED=Não autorizado
#XMSG Error message for HTTP 403 status
FORBIDDEN=Proibido

# Input validation
#XMSG Error message send to the users client when their message exceeds the limit. {0} = number of allowed characters
MESSAGE_TOO_LONG=A mensagem não pode exceder {0} caracteres.

# Quota enforcement
QUOTA_CONCURRENT_TASKS=O número máximo de {0} tarefas simultâneas foi atingido. Tente novamente mais tarde.
QUOTA_CONCURRENT_TASKS_PER_USER=O número máximo de {0} tarefas simultâneas por usuário foi atingido. Tente novamente mais tarde.
QUOTA_TASKS_PER_HOUR=O número máximo de {0} tarefas por hora para este locatário foi atingido. Tente novamente mais tarde.
QUOTA_TASKS_PER_HOUR_PER_USER=O número máximo de {0} tarefas por hora por usuário foi atingido. Tente novamente mais tarde.
QUOTA_TOOL_CALLS_PER_HOUR=A quantidade máxima de chamadas da ferramenta por hora foi usada ({0}). Tente novamente mais tarde.
QUOTA_LLM_TOKENS_PER_DAY=A quantidade máxima de tokens LLM para hoje já foi usada ({0}). Tente novamente amanhã.

# Content filter
CONTENT_FILTER_BLOCKED=Sua entrada foi bloqueada pelo filtro de segurança de conteúdo. Por favor, reformule.
CONTENT_FILTER_UNAVAILABLE=A verificação de segurança de conteúdo está temporariamente indisponível. Tente novamente.
CONTENT_FILTER_TOOL_BLOCKED=A última ferramenta chamada produziu um resultado malicioso. Tente uma direção diferente para evitar os mesmos dados maliciosos.

# Push notifications
PUSH_URL_NOT_ALLOWED=O URL de chamada de retorno de notificação push ''{0}'' não está nos domínios permitidos: {1}

# HITL
HITL_APPROVE=Aprovar
HITL_REJECT=Rejeitar
HITL_CONTINUE=Continuar
HITL_STOP=Parar
RESUME_REQUIRES_TEXT=A mensagem de retomada deve conter texto (por exemplo, ''aprovar'' ou ''rejeitar'') ou uma parte dos dados.

# LLM
LLM_UNAVAILABLE=O agente está temporariamente indisponível. Tente novamente mais tarde.
