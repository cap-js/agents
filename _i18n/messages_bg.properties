# Agent status messages (shown during task execution)
#XMSG Status info message send to the user client when a tool is called. {0} = tool name
agent_status_calling_tools=Извикване на {0}
#XMSG Status info message send to the user client when an entity is being queried. {0} = entity name
agent_status_querying=Запитване към {0}
#XMSG Status info message send to the user client after a tool result returned and the agent is processing it
agent_status_processing_response=Отговор от инструмент за обработка
#XMSG Status info message send to the user client after multiple tool results returned and the agent is processing it
agent_status_processing_responses=Отговори от инструмент за обработка
agent_status_summarizing_progress=Агентът е прекъснат. Напредъкът се обобщава.
AGENT_SUMMARY_QUOTA_FALLBACK=Задачата е спряна, тъй като е достигнала лимита си за потребление на ресурси. Част от работата може да е извършена – моля, проверете резултатите или опитайте отново с по-проста заявка.
AGENT_SUMMARY_TIMEOUT_FALLBACK=Задачата е спряна, тъй като е достигнала времевия си лимит. Напредъкът може да е непълен. Продължаване на изпълнението или спиране?

# Authentication
#XMSG Error message for HTTP 401 status
UNAUTHORIZED=Без оторизация
#XMSG Error message for HTTP 403 status
FORBIDDEN=Забранено

# Input validation
#XMSG Error message send to the users client when their message exceeds the limit. {0} = number of allowed characters
MESSAGE_TOO_LONG=Съобщението не може да надвишава {0} символа.

# Quota enforcement
QUOTA_CONCURRENT_TASKS=Достигнат е максимумът от {0} едновременни задачи. Моля, опитайте отново по-късно.
QUOTA_CONCURRENT_TASKS_PER_USER=Достигнат е максимумът от {0} едновременни задачи за един потребител. Моля, опитайте отново по-късно.
QUOTA_TASKS_PER_HOUR=Достигнат е максимумът от {0} задачи на час за този наемател. Моля, опитайте отново по-късно.
QUOTA_TASKS_PER_HOUR_PER_USER=Достигнат е максимумът от {0} задачи на час за един потребител. Моля, опитайте отново по-късно.
QUOTA_TOOL_CALLS_PER_HOUR=Използван е максималният брой извиквания на инструменти на час ({0}). Моля, опитайте отново по-късно.
QUOTA_LLM_TOKENS_PER_DAY=Максималният брой токени за LLM за днес вече е използван ({0}). Моля, опитайте отново утре.

# Content filter
CONTENT_FILTER_BLOCKED=Въведените от вас данни са блокирани от филтъра за безопасност на съдържанието. Моля, перифразирайте.
CONTENT_FILTER_UNAVAILABLE=Проверката за безопасност на съдържанието е временно недостъпна. Моля, опитайте отново.
CONTENT_FILTER_TOOL_BLOCKED=Последният извикан инструмент върна злонамерен резултат. Моля, опитайте различна посока на действие, за да избегнете същите злонамерени данни.

# Push notifications
PUSH_URL_NOT_ALLOWED=URL за обратно извикване на насочено известие ''{0}'' не е в разрешените домейни: {1}

# HITL
HITL_APPROVE=Одобряване
HITL_REJECT=Отхвърляне
HITL_CONTINUE=Напред
HITL_STOP=Стоп
RESUME_REQUIRES_TEXT=Съобщението за възобновяване трябва да съдържа текст (напр. „одобряване“ или „отхвърляне“) или част с данни.

# LLM
LLM_UNAVAILABLE=Агентът е временно недостъпен. Моля, опитайте отново по-късно.
