# Agent status messages (shown during task execution)
#XMSG Status info message send to the user client when a tool is called. {0} = tool name
agent_status_calling_tools=Kalder {0}
#XMSG Status info message send to the user client when an entity is being queried. {0} = entity name
agent_status_querying=Forespørger om {0}
#XMSG Status info message send to the user client after a tool result returned and the agent is processing it
agent_status_processing_response=Behandler svar fra værktøj
#XMSG Status info message send to the user client after multiple tool results returned and the agent is processing it
agent_status_processing_responses=Behandler svar fra værktøj
agent_status_summarizing_progress=Agent blev afbrudt. Opsummerer fremskridt.
AGENT_SUMMARY_QUOTA_FALLBACK=Opgaven blev stoppet, da den nåede sin ressourceforbrugsgrænse. Noget arbejde kan være udført – kontroller resultaterne, eller prøv igen med en enklere anmodning.
AGENT_SUMMARY_TIMEOUT_FALLBACK=Opgaven blev stoppet, da den nåede sin tidsgrænse. Fremskridt kan være ufuldstændig. Fortsæt med at køre, eller stop?

# Authentication
#XMSG Error message for HTTP 401 status
UNAUTHORIZED=Ikke autoriseret
#XMSG Error message for HTTP 403 status
FORBIDDEN=Forbudt

# Input validation
#XMSG Error message send to the users client when their message exceeds the limit. {0} = number of allowed characters
MESSAGE_TOO_LONG=Meddelelsen må ikke overskride {0} tegn.

# Quota enforcement
QUOTA_CONCURRENT_TASKS=Det maksimale antal på {0} samtidige opgaver er nået. Prøv igen senere.
QUOTA_CONCURRENT_TASKS_PER_USER=Det maksimale antal på {0} samtidige opgaver pr. bruger er nået. Prøv igen senere.
QUOTA_TASKS_PER_HOUR=Det maksimale antal på {0} opgaver pr. time for denne tenant er nået. Prøv igen senere.
QUOTA_TASKS_PER_HOUR_PER_USER=Det maksimale antal på {0} opgaver pr. time pr. bruger er nået. Prøv igen senere.
QUOTA_TOOL_CALLS_PER_HOUR=Den maksimale mængde værktøjskald pr. time blev brugt ({0}). Prøv igen senere.
QUOTA_LLM_TOKENS_PER_DAY=Det maksimale antal LLM-tokens for i dag er allerede brugt ({0}). Prøv igen i morgen.

# Content filter
CONTENT_FILTER_BLOCKED=Dit input blev blokeret af filteret for indholdssikkerhed. Vær venlig at omformulere.
CONTENT_FILTER_UNAVAILABLE=Indholdssikkerhedskontrollen er midlertidigt utilgængelig. Prøv igen.
CONTENT_FILTER_TOOL_BLOCKED=Det sidste kaldte værktøj gav et skadeligt resultat. Prøv en anden retning for at undgå de samme skadelige data.

# Push notifications
PUSH_URL_NOT_ALLOWED=Push-meddelelsens callback-URL ''{0}'' er ikke i tilladte domæner: {1}

# HITL
HITL_APPROVE=Godkend
HITL_REJECT=Afvis
HITL_CONTINUE=Fortsæt
HITL_STOP=Stop
RESUME_REQUIRES_TEXT=Genoptag meddelelse skal indeholde tekst (f.eks. ''godkend'' eller ''afvis'') eller en datadel.

# LLM
LLM_UNAVAILABLE=Agenten er midlertidigt utilgængelig. Prøv igen senere.
