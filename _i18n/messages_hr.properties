# Agent status messages (shown during task execution)
#XMSG Status info message send to the user client when a tool is called. {0} = tool name
agent_status_calling_tools=Pozivanje {0}
#XMSG Status info message send to the user client when an entity is being queried. {0} = entity name
agent_status_querying=Izvršavanje upita {0}
#XMSG Status info message send to the user client after a tool result returned and the agent is processing it
agent_status_processing_response=Odgovor alata obrade
#XMSG Status info message send to the user client after multiple tool results returned and the agent is processing it
agent_status_processing_responses=Odgovori alata obrade
agent_status_summarizing_progress=Agent prekinut. Sažimanje napretka.
AGENT_SUMMARY_QUOTA_FALLBACK=Zadatak je zaustavljen jer je dosegnuo svoje ograničenje potrošnje resursa. Neki su poslovi možda obavljeni — provjerite rezultate ili pokušajte ponovo s jednostavnijim zahtjevom.
AGENT_SUMMARY_TIMEOUT_FALLBACK=Zadatak je zaustavljen jer je dosegnuo svoje vremensko ograničenje. Napredak može biti nepotpun. Nastaviti s izvođenjem ili zaustaviti?

# Authentication
#XMSG Error message for HTTP 401 status
UNAUTHORIZED=Neautorizirano
#XMSG Error message for HTTP 403 status
FORBIDDEN=Zabranjeno

# Input validation
#XMSG Error message send to the users client when their message exceeds the limit. {0} = number of allowed characters
MESSAGE_TOO_LONG=Duljina poruke ne smije prekoračiti ovoliko znakova: {0}.

# Quota enforcement
QUOTA_CONCURRENT_TASKS=Dosegnut je maksimalan broj od ovoliko istovremenih zadataka: {0}. Pokušajte ponovo poslije.
QUOTA_CONCURRENT_TASKS_PER_USER=Dosegnut je maksimalan broj od ovoliko istovremenih zadataka po korisniku: {0}. Pokušajte ponovo poslije.
QUOTA_TASKS_PER_HOUR=Dosegnut je maksimalan broj od ovoliko zadataka za ovog zakupca: {0}. Pokušajte ponovo poslije.
QUOTA_TASKS_PER_HOUR_PER_USER=Dosegnut je maksimalan broj od ovoliko zadataka po korisniku: {0}. Pokušajte ponovo poslije.
QUOTA_TOOL_CALLS_PER_HOUR=Iskorišten je maksimalan broj poziva alata po satu ({0}). Pokušajte ponovo poslije.
QUOTA_LLM_TOKENS_PER_DAY=Već je upotrijebljen maksimalan iznos tokena LLM-a za danas ({0}). Pokušajte ponovo sutra.

# Content filter
CONTENT_FILTER_BLOCKED=Sigurnosni filtar sadržaja blokirao je vaš unos. Preformulirajte.
CONTENT_FILTER_UNAVAILABLE=Sigurnosna provjera sadržaja privremeno je nedostupna. Pokušajte ponovo.
CONTENT_FILTER_TOOL_BLOCKED=Posljednji pozvani alat izbacio je zlonamjeran rezultat. Pokušajte s drugim smjerom kako biste izbjegli iste zlonamjerne podatke.

# Push notifications
PUSH_URL_NOT_ALLOWED=URL povratnog poziva automatske obavijesti ''{0}'' nije u dopuštenim domenama: {1}

# HITL
HITL_APPROVE=Odobri
HITL_REJECT=Odbij
HITL_CONTINUE=Nastavi
HITL_STOP=Zaustavi
RESUME_REQUIRES_TEXT=Poruka o nastavku mora sadržavati tekst (npr. ''odobri'' ili ''odbij'') ili dio podataka.

# LLM
LLM_UNAVAILABLE=Trenutačni agent je privremeno nedostupan. Pokušajte ponovo poslije.
