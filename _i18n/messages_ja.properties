# Agent status messages (shown during task execution)
#XMSG Status info message send to the user client when a tool is called. {0} = tool name
agent_status_calling_tools=呼び出し中 {0}
#XMSG Status info message send to the user client when an entity is being queried. {0} = entity name
agent_status_querying=クエリ実行中 {0}
#XMSG Status info message send to the user client after a tool result returned and the agent is processing it
agent_status_processing_response=ツールの応答を処理しています
#XMSG Status info message send to the user client after multiple tool results returned and the agent is processing it
agent_status_processing_responses=ツールの応答を処理しています
agent_status_summarizing_progress=エージェントが中断されました。進捗を要約します。
AGENT_SUMMARY_QUOTA_FALLBACK=リソース消費制限に達したため、タスクを停止しました。一部の作業は行われた可能性があります。結果をチェックするか、より単純な要求で再び試してください。
AGENT_SUMMARY_TIMEOUT_FALLBACK=期限に達したため、タスクを停止しました。進捗は不完全となっている可能性があります。実行を続けますか? それとも、停止しますか?

# Authentication
#XMSG Error message for HTTP 401 status
UNAUTHORIZED=権限なし
#XMSG Error message for HTTP 403 status
FORBIDDEN=禁止

# Input validation
#XMSG Error message send to the users client when their message exceeds the limit. {0} = number of allowed characters
MESSAGE_TOO_LONG=メッセージは {0} 文字を超えないようにします。

# Quota enforcement
QUOTA_CONCURRENT_TASKS=同時タスクの最大数 {0} に達しました。後で再び試してください。
QUOTA_CONCURRENT_TASKS_PER_USER=ユーザ別の同時タスクの最大数 {0} に達しました。後で再び試してください。
QUOTA_TASKS_PER_HOUR=このテナントで時間あたりのタスクの最大数 {0} に達しました。後で再び試してください。
QUOTA_TASKS_PER_HOUR_PER_USER=ユーザ別の時間あたりのタスクの最大数 {0} に達しました。後で再び試してください。
QUOTA_TOOL_CALLS_PER_HOUR=時間あたりのツール呼び出しが最大限まで使用されました ({0})。後で再び試してください。
QUOTA_LLM_TOKENS_PER_DAY=本日の LLM トークンが最大限まで使用されました ({0})。明日もう一度試しください。

# Content filter
CONTENT_FILTER_BLOCKED=入力がコンテンツセーフティフィルタによってブロックされました。言い換えてください。
CONTENT_FILTER_UNAVAILABLE=コンテンツセーフティチェックが一時的に利用できません。再び試してください。
CONTENT_FILTER_TOOL_BLOCKED=最後に呼び出したツールにより、悪意のある結果が得られました。この悪意のあるデータが再び発生しないように、別の方法を試してください。

# Push notifications
PUSH_URL_NOT_ALLOWED=プッシュ通知コールバック URL ''{0}'' は、許可されたドメイン {1} にありません。

# HITL
HITL_APPROVE=承認
HITL_REJECT=却下
HITL_CONTINUE=続行
HITL_STOP=停止
RESUME_REQUIRES_TEXT=再開メッセージには、テキスト (例: ''承認'' や ''却下'') またはデータ部分が含まれている必要があります。

# LLM
LLM_UNAVAILABLE=このエージェントは一時的に利用できません。後でもう一度実行してください。
