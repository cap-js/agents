# Agent status messages (shown during task execution)
#XMSG Status info message send to the user client when a tool is called. {0} = tool name
agent_status_calling_tools=קריאה ל-{0}
#XMSG Status info message send to the user client when an entity is being queried. {0} = entity name
agent_status_querying=ביצוע שאילתה ל-{0}
#XMSG Status info message send to the user client after a tool result returned and the agent is processing it
agent_status_processing_response=תגובת כלי עיבוד
#XMSG Status info message send to the user client after multiple tool results returned and the agent is processing it
agent_status_processing_responses=תגובות כלי עיבוד
agent_status_summarizing_progress=סוכן הופסק. סיכום התקדמות.
AGENT_SUMMARY_QUOTA_FALLBACK=המשימה הופסקה מכיוון שהיא הגיעה למגבלת צריכת המשאבים שלה. ייתכן שחלק מהעבודה בוצע - בדוק את התוצאות או נסה שוב עם בקשה פשוטה יותר.
AGENT_SUMMARY_TIMEOUT_FALLBACK=המשימה הופסקה מכיוון שהיא הגיעה למגבלת הזמן שלה. התקדמות עשויה להיות לא שלמה. האם להמשיך לפעול או להפסיק?

# Authentication
#XMSG Error message for HTTP 401 status
UNAUTHORIZED=לא מורשה
#XMSG Error message for HTTP 403 status
FORBIDDEN=אסור

# Input validation
#XMSG Error message send to the users client when their message exceeds the limit. {0} = number of allowed characters
MESSAGE_TOO_LONG=ההודעה לא יכולה לחרוג מ-{0} תווים.

# Quota enforcement
QUOTA_CONCURRENT_TASKS=הגעת למקסימום של {0} משימות בו-זמניות. נסה שוב מאוחר יותר.
QUOTA_CONCURRENT_TASKS_PER_USER=הגעת למקסימום של {0} משימות בו-זמניות למשתמש. נסה שוב מאוחר יותר.
QUOTA_TASKS_PER_HOUR=הגעת למקסימום של {0} משימות לשעה עבור דייר זה. נסה שוב מאוחר יותר.
QUOTA_TASKS_PER_HOUR_PER_USER=הגעת למקסימום של {0} משימות לשעה לכל משתמש. נסה שוב מאוחר יותר.
QUOTA_TOOL_CALLS_PER_HOUR=נעשה שימוש בסכום המקסימלי של קריאות כלים לשעה ({0}). נסה שוב מאוחר יותר.
QUOTA_LLM_TOKENS_PER_DAY=הסכום המקסימלי של אסימוני LLM להיום כבר נוצל ({0}). נסה שוב מחר.

# Content filter
CONTENT_FILTER_BLOCKED=הקלט שלך נחסם על-ידי מסנן הבטיחות של התוכן. נסח מחדש.
CONTENT_FILTER_UNAVAILABLE=בדיקת הבטיחות של התוכן אינה זמינה באופן זמני. נסה שוב.
CONTENT_FILTER_TOOL_BLOCKED=הכלי האחרון שנקרא הניב תוצאה זדונית. נסה כיוון אחר כדי להימנע מאותם נתונים זדוניים.

# Push notifications
PUSH_URL_NOT_ALLOWED=כתובת URL להתקשרות חזרה של הודעת דחיפה ''{0}'' אינה בתחומים המותרים: {1}

# HITL
HITL_APPROVE=אשר
HITL_REJECT=דחה
HITL_CONTINUE=המשך
HITL_STOP=הפסק
RESUME_REQUIRES_TEXT=הודעת קורות חיים חייבת לכלול טקסט (לדוגמה: ''אשר'' או ''דחה'') או חלק נתונים.

# LLM
LLM_UNAVAILABLE=הסוכן לא זמין באופן זמני. נסה שוב מאוחר יותר.
