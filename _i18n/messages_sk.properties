# Agent status messages (shown during task execution)
#XMSG Status info message send to the user client when a tool is called. {0} = tool name
agent_status_calling_tools=Volá sa {0}
#XMSG Status info message send to the user client when an entity is being queried. {0} = entity name
agent_status_querying=Dotazuje sa {0}
#XMSG Status info message send to the user client after a tool result returned and the agent is processing it
agent_status_processing_response=Spracováva sa odpoveď nástroja
#XMSG Status info message send to the user client after multiple tool results returned and the agent is processing it
agent_status_processing_responses=Spracovávajú sa odpovede nástroja
agent_status_summarizing_progress=Agent prerušený. Zhrnutie pokroku.
AGENT_SUMMARY_QUOTA_FALLBACK=Úloha bola zastavená, keď dosiahla limit spotreby zdrojov. Niektoré práce mohli byť vykonané – skontrolujte výsledky alebo to skúste znova s jednoduchšou požiadavkou.
AGENT_SUMMARY_TIMEOUT_FALLBACK=Úloha bola zastavená po uplynutí časového limitu. Spracovanie môže byť neúplné. Chcete pokračovať v spustení alebo zastaviť?

# Authentication
#XMSG Error message for HTTP 401 status
UNAUTHORIZED=Nemáte oprávnenie
#XMSG Error message for HTTP 403 status
FORBIDDEN=Zakázané

# Input validation
#XMSG Error message send to the users client when their message exceeds the limit. {0} = number of allowed characters
MESSAGE_TOO_LONG=Správa nesmie presiahnuť {0} znakov.

# Quota enforcement
QUOTA_CONCURRENT_TASKS=Bolo dosiahnutých maximum {0} súbežných úloh. Skúste to znova neskôr.
QUOTA_CONCURRENT_TASKS_PER_USER=Bolo dosiahnutých maximum {0} súbežných úloh na používateľa. Skúste to znova neskôr.
QUOTA_TASKS_PER_HOUR=Bolo dosiahnutých maximum {0} úloh za hodinu pre tohto nájomcu. Skúste to znova neskôr.
QUOTA_TASKS_PER_HOUR_PER_USER=Bolo dosiahnutých maximum {0} úloh za hodinu na používateľa. Skúste to znova neskôr.
QUOTA_TOOL_CALLS_PER_HOUR=Bol použitý maximálny počet volaní nástrojov za hodinu ({0}). Skúste to znova neskôr.
QUOTA_LLM_TOKENS_PER_DAY=Dnešný maximálny počet tokenov LLM už bol vyčerpaný ({0}). Skúste to znova zajtra.

# Content filter
CONTENT_FILTER_BLOCKED=Vaše zadanie bolo zablokované filtrom bezpečnosti obsahu. Zmeňte formuláciu.
CONTENT_FILTER_UNAVAILABLE=Kontrola bezpečnosti obsahu je dočasne nedostupná. Skúste to znova.
CONTENT_FILTER_TOOL_BLOCKED=Posledný volaný nástroj vrátil škodlivý výsledok. Skúste iný smer, aby ste sa vyhli rovnakým škodlivým údajom.

# Push notifications
PUSH_URL_NOT_ALLOWED=Adresa URL pre spätné volanie zobrazovania upozornení ''{0}'' nie je v povolených doménach: {1}

# HITL
HITL_APPROVE=Schváliť
HITL_REJECT=Zamietnuť
HITL_CONTINUE=Pokračovať
HITL_STOP=Zastaviť
RESUME_REQUIRES_TEXT=Správa o pokračovaní musí obsahovať text (napr. ''schváliť'' alebo ''zamietnuť'') alebo dátovú časť.

# LLM
LLM_UNAVAILABLE=Agent je dočasne nedostupný. Skúste neskôr znova.
