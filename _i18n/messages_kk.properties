# Agent status messages (shown during task execution)
#XMSG Status info message send to the user client when a tool is called. {0} = tool name
agent_status_calling_tools={0} шақырылуда
#XMSG Status info message send to the user client when an entity is being queried. {0} = entity name
agent_status_querying={0} объектісіне сұрау жіберілуде
#XMSG Status info message send to the user client after a tool result returned and the agent is processing it
agent_status_processing_response=Өңдеу құралының жауабы
#XMSG Status info message send to the user client after multiple tool results returned and the agent is processing it
agent_status_processing_responses=Өңдеу құралының жауаптары
agent_status_summarizing_progress=Агент жұмысы үзілді. Қорытындылау орындалуда.
AGENT_SUMMARY_QUOTA_FALLBACK=Тапсырма ресурсты тұтыну шегіне жеткендіктен тоқтатылды. Кейбір жұмыс орындалған болуы мүмкін. Нәтижелерді тексеріңіз немесе әрекетті жеңілдеу сұраумен қайталаңыз.
AGENT_SUMMARY_TIMEOUT_FALLBACK=Тапсырма уақыт шегіне жеткендіктен тоқтатылды. Толықтай орындалмаған болмауы мүмкін. Орындауды жалғастыру қажет пе, әлде тоқтату қажет пе?

# Authentication
#XMSG Error message for HTTP 401 status
UNAUTHORIZED=Өкілеттік жоқ
#XMSG Error message for HTTP 403 status
FORBIDDEN=Тыйым салынған

# Input validation
#XMSG Error message send to the users client when their message exceeds the limit. {0} = number of allowed characters
MESSAGE_TOO_LONG=Хабар ұзындығы {0} таңбадан аспауы керек.

# Quota enforcement
QUOTA_CONCURRENT_TASKS=Бір уақытта орындауға болатын максималды тапсырмалар санына ({0}) жетті. Әрекетті кейінірек қайталаңыз.
QUOTA_CONCURRENT_TASKS_PER_USER=Бір пайдаланушыға бір уақытта орындауға болатын максималды тапсырмалар санына ({0}) жетті. Әрекетті кейінірек қайталаңыз.
QUOTA_TASKS_PER_HOUR=Бұл тенант үшін сағатына орындауға болатын максималды тапсырмалар санына ({0}) жетті. Әрекетті кейінірек қайталаңыз.
QUOTA_TASKS_PER_HOUR_PER_USER=Бір пайдаланушыға сағатына орындауға болатын максималды тапсырмалар санына ({0}) жетті. Әрекетті кейінірек қайталаңыз.
QUOTA_TOOL_CALLS_PER_HOUR=Бір сағаттағы құрал шақыруларының максималды саны пайдаланылды ({0}). Әрекетті кейінірек қайталаңыз.
QUOTA_LLM_TOKENS_PER_DAY=Бүгінгі күнге арналған LLM маркерлерінің максималды саны әлдеқашан пайдаланылды ({0}). Әрекетті ертең қайталаңыз.

# Content filter
CONTENT_FILTER_BLOCKED=Енгізіліміңіз мазмұн қауіпсіздігінің сүзгісімен блокталды. Басқаша жазыңыз.
CONTENT_FILTER_UNAVAILABLE=Мазмұн қауіпсіздігін тексеру мүмкіндігі уақытша қолжетімсіз. Әрекетті қайталаңыз.
CONTENT_FILTER_TOOL_BLOCKED=Соңғы рет шақырылған құрал зиянды нәтижеге әкелді. Бірдей зиянды деректің алынуына жол бермеу үшін басқа бағытты қолданып көріңіз.

# Push notifications
PUSH_URL_NOT_ALLOWED=''{0}'' push хабарландыруын кері шақыру URL мекенжайы рұқсат етілген домендерде емес: {1}

