HITL_APPROVE=Бекіту
HITL_REJECT=Қабылдамау
HITL_CONTINUE=Жалғастыру
HITL_STOP=Тоқтату
RESUME_REQUIRES_TEXT=Жалғастыру хабарында мәтін (мысалы, ''бекіту'' немесе ''қабылдамау'') немесе дерек бөлігі болуы керек.

# LLM
LLM_UNAVAILABLE=Агент уақытша қолжетімсіз. Әрекетті кейінірек қайталаңыз.
