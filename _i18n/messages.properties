# Agent status messages (shown during task execution)
#XMSG Status info message send to the user client when a tool is called. {0} = tool name
agent_status_calling_tools = Calling {0}
#XMSG Status info message send to the user client when an entity is being queried. {0} = entity name
agent_status_querying = Querying {0}
#XMSG Status info message send to the user client after a tool result returned and the agent is processing it
agent_status_processing_response = Processing tool response
#XMSG Status info message send to the user client after multiple tool results returned and the agent is processing it
agent_status_processing_responses = Processing tool responses
agent_status_summarizing_progress = Agent interrupted. Summarising progress.
AGENT_SUMMARY_QUOTA_FALLBACK = The task was stopped as it reached its resource consumption limit. Some work may have been done — please check the results or retry with a simpler request.
AGENT_SUMMARY_TIMEOUT_FALLBACK = The task was stopped as it reached its time limit. Progress may be incomplete. Continue running or stop?

# Authentication
#XMSG Error message for HTTP 401 status
UNAUTHORIZED = Unauthorized
#XMSG Error message for HTTP 403 status
FORBIDDEN = Forbidden

# Input validation
#XMSG Error message send to the users client when their message exceeds the limit. {0} = number of allowed characters
MESSAGE_TOO_LONG = The message must not exceed {0} characters.

# Quota enforcement
QUOTA_CONCURRENT_TASKS = The maximum of {0} concurrent tasks is reached. Please try again later.
QUOTA_CONCURRENT_TASKS_PER_USER = The maximum of {0} concurrent tasks per user is reached. Please try again later.
QUOTA_TASKS_PER_HOUR = The maximum of {0} tasks per hour for this tenant is reached. Please try again later.
QUOTA_TASKS_PER_HOUR_PER_USER = The maximum of {0} tasks per hour per user is reached. Please try again later.
QUOTA_TOOL_CALLS_PER_HOUR = The maximum amount of tool calls per hour was used ({0}). Please try again later.
QUOTA_LLM_TOKENS_PER_DAY = The maximum amount of LLM tokens for today was already used ({0}). Please try again tomorrow.

# Content filter
CONTENT_FILTER_BLOCKED = Your input was blocked by the content safety filter. Please rephrase.
CONTENT_FILTER_UNAVAILABLE = The content safety check is temporarily unavailable. Please try again.
CONTENT_FILTER_TOOL_BLOCKED = The last tool called yielded a malicious result. Please try a different direction to avoid the same malicious data.

# Push notifications
PUSH_URL_NOT_ALLOWED = Push notification callback URL ''{0}'' not in allowed domains: {1}

# HITL
HITL_APPROVE = Approve
HITL_REJECT = Reject
HITL_CONTINUE = Continue
HITL_STOP = Stop
RESUME_REQUIRES_TEXT = Resume message must contain text (e.g. 'approve' or 'reject') or a data part.
