CONTENT_FILTER_BLOCKED = Your input was blocked by the content safety filter. Please rephrase.
CONTENT_FILTER_UNAVAILABLE = The content safety check is temporarily unavailable. Please try again.
CONTENT_FILTER_TOOL_BLOCKED = The last tool called yielded a malicious result. Please try a different direction to avoid the same malicious data.

# Push notifications
PUSH_URL_NOT_ALLOWED = Push notification callback URL ''{0}'' not in allowed domains: {1}

# HITL
RESUME_REQUIRES_TEXT = Resume message must contain text (e.g. ''approve'' or ''reject'').
