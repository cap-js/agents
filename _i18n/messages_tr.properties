# Agent status messages (shown during task execution)
#XMSG Status info message send to the user client when a tool is called. {0} = tool name
agent_status_calling_tools={0} aranıyor
#XMSG Status info message send to the user client when an entity is being queried. {0} = entity name
agent_status_querying={0} sorgulanıyor
#XMSG Status info message send to the user client after a tool result returned and the agent is processing it
agent_status_processing_response=İşleme aracı yanıtı
#XMSG Status info message send to the user client after multiple tool results returned and the agent is processing it
agent_status_processing_responses=İşleme aracı yanıtları
agent_status_summarizing_progress=Aracı kesintiye uğradı. İlerleme özetleniyor.
AGENT_SUMMARY_QUOTA_FALLBACK=Görev, kaynak tüketim sınırına ulaştığından durduruldu. Bazı işler yapılmış olabilir. Sonuçları kontrol edin veya daha basit bir taleple yeniden deneyin.
AGENT_SUMMARY_TIMEOUT_FALLBACK=Görev, zaman sınırına ulaştığından durduruldu. İlerleme tamamlanmamış olabilir. Çalıştırmaya devam edilsin mi yoksa durdurulsun mu?

# Authentication
#XMSG Error message for HTTP 401 status
UNAUTHORIZED=Yetkilendirilmedi
#XMSG Error message for HTTP 403 status
FORBIDDEN=Yasak

# Input validation
#XMSG Error message send to the users client when their message exceeds the limit. {0} = number of allowed characters
MESSAGE_TOO_LONG=İleti {0} karakteri aşmamalıdır.

# Quota enforcement
QUOTA_CONCURRENT_TASKS=Azami {0} eş zamanlı göreve ulaşıldı. Daha sonra tekrar deneyin.
QUOTA_CONCURRENT_TASKS_PER_USER=Kullanıcı başına azami {0} eş zamanlı göreve ulaşıldı. Daha sonra tekrar deneyin.
QUOTA_TASKS_PER_HOUR=Bu kiraci için saat başına azami {0} göreve ulaşıldı. Daha sonra tekrar deneyin.
QUOTA_TASKS_PER_HOUR_PER_USER=Kullanıcı başına saatlik azami {0} göreve ulaşıldı. Daha sonra tekrar deneyin.
QUOTA_TOOL_CALLS_PER_HOUR=Saat başına azami araç çağrısı miktarı kullanıldı ({0}). Daha sonra tekrar deneyin.
QUOTA_LLM_TOKENS_PER_DAY=Bugün için azami LLM belirteci miktarı zaten kullanıldı ({0}). Yarın tekrar deneyin.

# Content filter
CONTENT_FILTER_BLOCKED=Girişiniz içerik güvenlik filtresi tarafından bloke edildi. Başka bir ifade kullanın.
CONTENT_FILTER_UNAVAILABLE=İçerik güvenlik kontrolü geçici olarak kullanılamıyor. Tekrar deneyin.
CONTENT_FILTER_TOOL_BLOCKED=Çağrılan son araç zararlı bir sonuç verdi. Aynı zararlı verilerden kaçınmak için farklı bir yön deneyin.

# Push notifications
PUSH_URL_NOT_ALLOWED=Push bildirimi geri çağırma URL''si ''{0}'', izin verilen etki alanlarında değil: {1}

# HITL
HITL_APPROVE=Onayla
HITL_REJECT=Reddet
HITL_CONTINUE=Devam et
HITL_STOP=Durdur
RESUME_REQUIRES_TEXT=Sürdürme iletisi metin (ör. ''onayla'' veya ''reddet'') veya veri parçası içermelidir.

# LLM
LLM_UNAVAILABLE=Aracı geçici olarak kullanım dışı. Daha sonra tekrar deneyin.
