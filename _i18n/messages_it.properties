# Agent status messages (shown during task execution)
#XMSG Status info message send to the user client when a tool is called. {0} = tool name
agent_status_calling_tools=Chiamata in corso di {0}
#XMSG Status info message send to the user client when an entity is being queried. {0} = entity name
agent_status_querying=Query in corso di {0}
#XMSG Status info message send to the user client after a tool result returned and the agent is processing it
agent_status_processing_response=Elaborazione risposta tool in corso
#XMSG Status info message send to the user client after multiple tool results returned and the agent is processing it
agent_status_processing_responses=Elaborazione risposte tool in corso
agent_status_summarizing_progress=Agente interrotto. Riassunto dei progressi in corso.
AGENT_SUMMARY_QUOTA_FALLBACK=Il task è stato interrotto perché ha raggiunto il limite di consumo delle risorse. Alcune operazioni potrebbero essere state eseguite: controllare i risultati o riprovare con una richiesta più semplice.
AGENT_SUMMARY_TIMEOUT_FALLBACK=Il task è stato interrotto poiché ha raggiunto il limite di tempo. L''avanzamento potrebbe essere incompleto. Continuare l''esecuzione o interromperla?

# Authentication
#XMSG Error message for HTTP 401 status
UNAUTHORIZED=Non autorizzato
#XMSG Error message for HTTP 403 status
FORBIDDEN=Vietato

# Input validation
#XMSG Error message send to the users client when their message exceeds the limit. {0} = number of allowed characters
MESSAGE_TOO_LONG=Il messaggio non deve superare {0} caratteri.

# Quota enforcement
QUOTA_CONCURRENT_TASKS=È stato raggiunto il numero massimo di {0} task simultanei. Riprovare più tardi.
QUOTA_CONCURRENT_TASKS_PER_USER=È stato raggiunto il numero massimo di {0} task simultanei per ciascun utente. Riprovare più tardi.
QUOTA_TASKS_PER_HOUR=È stato raggiunto il numero massimo di {0} task all''ora per questo tenant. Riprovare più tardi.
QUOTA_TASKS_PER_HOUR_PER_USER=È stato raggiunto il numero massimo di {0} task all''ora per ciascun utente. Riprovare più tardi.
QUOTA_TOOL_CALLS_PER_HOUR=È stato utilizzato il numero massimo di chiamate del tool all''ora ({0}). Riprovare più tardi.
QUOTA_LLM_TOKENS_PER_DAY=È già stata utilizzata la quantità massima di token LLM per oggi ({0}). Riprovare domani.

# Content filter
CONTENT_FILTER_BLOCKED=L’inserimento è stato bloccato dal filtro di sicurezza del contenuto. Riformulare.
CONTENT_FILTER_UNAVAILABLE=Il controllo di sicurezza del contenuto è temporaneamente non disponibile. Riprovare.
CONTENT_FILTER_TOOL_BLOCKED=L''ultimo tool chiamato ha prodotto un risultato dannoso. Provare con una direzione diversa per evitare gli stessi dati dannosi.

# Push notifications
PUSH_URL_NOT_ALLOWED=URL callback notifica push ''{0}'' non in domini consentiti: {1}

# HITL
HITL_APPROVE=Approva
HITL_REJECT=Rifiuta
HITL_CONTINUE=Continua
HITL_STOP=Interrompi
RESUME_REQUIRES_TEXT=Il messaggio di ripresa deve contenere testo (ad es. ''approva'' o ''rifiuta'') o una parte di dati.

# LLM
LLM_UNAVAILABLE=L''agente è temporaneamente non disponibile. Riprovare più tardi.
