# Agent status messages (shown during task execution)
#XMSG Status info message send to the user client when a tool is called. {0} = tool name
agent_status_calling_tools=Виклик {0}
#XMSG Status info message send to the user client when an entity is being queried. {0} = entity name
agent_status_querying=Виконується запит {0}
#XMSG Status info message send to the user client after a tool result returned and the agent is processing it
agent_status_processing_response=Відповідь інструмента обробки
#XMSG Status info message send to the user client after multiple tool results returned and the agent is processing it
agent_status_processing_responses=Відповіді інструмента обробки
agent_status_summarizing_progress=Агента перервано. Підсумовування перебігу виконання.
AGENT_SUMMARY_QUOTA_FALLBACK=Завдання було зупинено, оскільки воно досягло свого ліміту споживання ресурсів. Можливо, була виконана якась робота — перевірте результати або повторіть спробу з простішим запитом.
AGENT_SUMMARY_TIMEOUT_FALLBACK=Завдання було зупинено, оскільки воно досягло ліміту часу. Перебіг виконання може бути неповним. Продовжити виконання або зупинити?

# Authentication
#XMSG Error message for HTTP 401 status
UNAUTHORIZED=Немає повноважень
#XMSG Error message for HTTP 403 status
FORBIDDEN=Заборонено

# Input validation
#XMSG Error message send to the users client when their message exceeds the limit. {0} = number of allowed characters
MESSAGE_TOO_LONG=Розмір повідомлення не повинен перевищувати {0} символів.

# Quota enforcement
QUOTA_CONCURRENT_TASKS=Досягнуто максимальну кількість {0} паралельних завдань. Повторіть спробу пізніше.
QUOTA_CONCURRENT_TASKS_PER_USER=Досягнуто максимальну кількість {0} паралельних завдань на користувача. Повторіть спробу пізніше.
QUOTA_TASKS_PER_HOUR=Досягнуто максимальну кількість {0} завдань на годину для цього клієнта. Повторіть спробу пізніше.
QUOTA_TASKS_PER_HOUR_PER_USER=Досягнуто максимальну кількість {0} завдань на годину на користувача. Повторіть спробу пізніше.
QUOTA_TOOL_CALLS_PER_HOUR=Використано максимальну кількість викликів інструмента на годину ({0}). Повторіть спробу пізніше.
QUOTA_LLM_TOKENS_PER_DAY=Максимальну кількість токенів ВММ на сьогодні вже використано ({0}). Повторіть спробу завтра.

# Content filter
CONTENT_FILTER_BLOCKED=Ваше введення заблоковано фільтром безпеки вмісту. Перефразуйте.
CONTENT_FILTER_UNAVAILABLE=Перевірка безпеки вмісту тимчасово недоступна. Повторіть спробу.
CONTENT_FILTER_TOOL_BLOCKED=Останній інструмент під назвою дав шкідливий результат. Спробуйте інший напрямок, щоб уникнути тих самих шкідливих даних.

# Push notifications
PUSH_URL_NOT_ALLOWED=URL зворотного виклику push-сповіщення ''{0}'' відсутній у дозволених доменах: {1}

# HITL
HITL_APPROVE=Схвалити
HITL_REJECT=Відхилити
HITL_CONTINUE=Продовжити
HITL_STOP=Зупинити
RESUME_REQUIRES_TEXT=Повідомлення про продовження має містити текст (наприклад, ''схвалити'' або ''відхилити'') або частину даних.

# LLM
LLM_UNAVAILABLE=Агент тимчасово недоступний. Повторіть спробу пізніше.
