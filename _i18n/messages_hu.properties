# Agent status messages (shown during task execution)
#XMSG Status info message send to the user client when a tool is called. {0} = tool name
agent_status_calling_tools={0} hívása
#XMSG Status info message send to the user client when an entity is being queried. {0} = entity name
agent_status_querying={0} lekérdezése
#XMSG Status info message send to the user client after a tool result returned and the agent is processing it
agent_status_processing_response=Eszköz válaszának feldolgozása
#XMSG Status info message send to the user client after multiple tool results returned and the agent is processing it
agent_status_processing_responses=Eszköz válaszainak feldolgozása
agent_status_summarizing_progress=Az ágens megszakadt. Az előrehaladás összefoglalása.
AGENT_SUMMARY_QUOTA_FALLBACK=A feladat leállt, mert elérte az erőforrás-felhasználási korlátját. Lehet, hogy vannak elvégzett munkák – ellenőrizze az eredményeket, vagy próbálja meg újra egy egyszerűbb kéréssel.
AGENT_SUMMARY_TIMEOUT_FALLBACK=A feladat leállt, mert elérte az időkorlátját. Az előrehaladás hiányos lehet. Folytatja a futást vagy leállítja?

# Authentication
#XMSG Error message for HTTP 401 status
UNAUTHORIZED=Nem engedélyezett
#XMSG Error message for HTTP 403 status
FORBIDDEN=Tiltott

# Input validation
#XMSG Error message send to the users client when their message exceeds the limit. {0} = number of allowed characters
MESSAGE_TOO_LONG=Az üzenet legfeljebb {0} karakter hosszú lehet.

# Quota enforcement
QUOTA_CONCURRENT_TASKS=Elérte az egyidejű feladatok maximális számát ({0}). Próbálkozzon újra később.
QUOTA_CONCURRENT_TASKS_PER_USER=Elérte az egyidejű feladatok felhasználónkénti maximális számát ({0}). Próbálkozzon újra később.
QUOTA_TASKS_PER_HOUR=Elérte a bérlő óránkénti feladatainak maximális számát ({0}). Próbálkozzon újra később.
QUOTA_TASKS_PER_HOUR_PER_USER=Elérte a feladatok óránkénti és felhasználónkénti maximális számát ({0}). Próbálkozzon újra később.
QUOTA_TOOL_CALLS_PER_HOUR=Az óránkénti eszközhívások maximális mennyiségét felhasználta ({0}). Próbálkozzon újra később.
QUOTA_LLM_TOKENS_PER_DAY=A mai LLM-tokenek maximális mennyiségét felhasználta ({0}). Próbálkozzon újra holnap.

# Content filter
CONTENT_FILTER_BLOCKED=A tartalombiztonsági szűrő zárolta a bevitelt. Módosítsa a megfogalmazást.
CONTENT_FILTER_UNAVAILABLE=A tartalom biztonsági ellenőrzése átmenetileg nem érhető el. Próbálja meg újra.
CONTENT_FILTER_TOOL_BLOCKED=Az utolsóként hívott eszköz rosszindulatú eredményt hozott. Próbálkozzon más iránnyal, hogy elkerülje ugyanazokat a rosszindulatú adatokat.

# Push notifications
PUSH_URL_NOT_ALLOWED=A(z) ''{0}'' push értesítési visszahívási URL nem szerepel az engedélyezett tartományok között: {1}

# HITL
HITL_APPROVE=Jóváhagyás
HITL_REJECT=Elutasítás
HITL_CONTINUE=Folytatás
HITL_STOP=Leállítás
RESUME_REQUIRES_TEXT=A folytatási üzenetnek szöveget (például ''jóváhagyás'' vagy ''elutasítás'') vagy adatrészt kell tartalmaznia.

# LLM
LLM_UNAVAILABLE=Az ügynök átmenetileg nem érhető el. Próbálkozzon újra később.
