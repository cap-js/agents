# Agent status messages (shown during task execution)
#XMSG Status info message send to the user client when a tool is called. {0} = tool name
agent_status_calling_tools=Κλήση {0}
#XMSG Status info message send to the user client when an entity is being queried. {0} = entity name
agent_status_querying=Γίνεται αναζήτηση {0}
#XMSG Status info message send to the user client after a tool result returned and the agent is processing it
agent_status_processing_response=Απάντηση εργαλείου επεξεργασίας
#XMSG Status info message send to the user client after multiple tool results returned and the agent is processing it
agent_status_processing_responses=Απαντήσεις εργαλείου επεξεργασίας
agent_status_summarizing_progress=Ο πράκτορας διακόπηκε. Σύνοψη προόδου.
AGENT_SUMMARY_QUOTA_FALLBACK=Η εργασία διακόπηκε καθώς έφτασε το όριο ανάλωσης πόρων. Μπορεί να έχει γίνει κάποια εργασία — ελέγξτε τα αποτελέσματα ή δοκιμάστε ξανά με ένα απλούστερο αίτημα.
AGENT_SUMMARY_TIMEOUT_FALLBACK=Η εργασία διακόπηκε καθώς έφτασε στο χρονικό της όριο. Η πρόοδος μπορεί να είναι ελλιπής. Συνέχεια εκτέλεσης ή διακοπής;

# Authentication
#XMSG Error message for HTTP 401 status
UNAUTHORIZED=Μη Εξουσιοδοτημένος
#XMSG Error message for HTTP 403 status
FORBIDDEN=Απαγορευμένο

# Input validation
#XMSG Error message send to the users client when their message exceeds the limit. {0} = number of allowed characters
MESSAGE_TOO_LONG=Το μήνυμα δεν πρέπει να υπερβαίνει τους {0} χαρακτήρες.

# Quota enforcement
QUOTA_CONCURRENT_TASKS=Ο μέγιστος αριθμός {0} ταυτόχρονων εργασιών προσεγγίστηκε. Δοκιμάστε ξανά αργότερα.
QUOTA_CONCURRENT_TASKS_PER_USER=Ο μέγιστος αριθμός {0} ταυτόχρονων εργασιώνανά χρήστη προσεγγίστηκε. Δοκιμάστε ξανά αργότερα.
QUOTA_TASKS_PER_HOUR=Ο μέγιστος αριθμός {0} εργασιών ανά ώρα για αυτόν τον μισθωτή προσεγγίστηκε. Δοκιμάστε ξανά αργότερα.
QUOTA_TASKS_PER_HOUR_PER_USER=Ο μέγιστος αριθμός {0} εργασιών ανά χρήστη προσεγγίστηκε. Δοκιμάστε ξανά αργότερα.
QUOTA_TOOL_CALLS_PER_HOUR=Χρησιμοποιήθηκε ο μέγιστος αριθμός κλήσεων εργαλείων ανά ώρα ({0}). Δοκιμάστε ξανά αργότερα.
QUOTA_LLM_TOKENS_PER_DAY=Το μέγιστο ποσό διακριτικών LLM για σήμερα χρησιμοποιήθηκε ήδη ({0}). Δοκιμάστε ξανά αύριο.

# Content filter
CONTENT_FILTER_BLOCKED=Η καταχώρισή σας δεσμεύτηκε από το φίλτρο ασφάλειας περιεχομένου. Αναδιατυπώστε.
CONTENT_FILTER_UNAVAILABLE=Ο έλεγχος ασφάλειας περιεχομένου είναι προσωρινά μη διαθέσιμος. Δοκιμάστε ξανά.
CONTENT_FILTER_TOOL_BLOCKED=Το τελευταίο εργαλείο που ονομάζεται απέδωσε ένα κακόβουλο αποτέλεσμα. Δοκιμάστε διαφορετική κατεύθυνση για να αποφύγετε τα ίδια κακόβουλα δεδομένα.

# Push notifications
PUSH_URL_NOT_ALLOWED=URL ανάκλησης ειδοποίησης push ''{0}'' δεν είναι σε επιτρεπόμενους τομείς: {1}

# HITL
HITL_APPROVE=Έγκριση
HITL_REJECT=Απόρριψη
HITL_CONTINUE=Συνέχεια
HITL_STOP=Διακοπή
RESUME_REQUIRES_TEXT=Το μήνυμα συνέχισης πρέπει να περιέχει κείμενο (π.χ. ''έγκριση'' ή ''απόρριψη'') ή μέρος δεδομένων.

# LLM
LLM_UNAVAILABLE=Ο πράκτορας είναι προσωρινά μη διαθέσιμος. Προσπαθήστε ξανά αργότερα.
