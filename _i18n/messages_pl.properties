# Agent status messages (shown during task execution)
#XMSG Status info message send to the user client when a tool is called. {0} = tool name
agent_status_calling_tools=Wywoływanie {0}
#XMSG Status info message send to the user client when an entity is being queried. {0} = entity name
agent_status_querying=Wykonywanie zapytania {0}
#XMSG Status info message send to the user client after a tool result returned and the agent is processing it
agent_status_processing_response=Przetwarzanie odpowiedzi narzędzia
#XMSG Status info message send to the user client after multiple tool results returned and the agent is processing it
agent_status_processing_responses=Przetwarzanie odpowiedzi narzędzia
agent_status_summarizing_progress=Agent został przerwany. Podsumowanie postępów.
AGENT_SUMMARY_QUOTA_FALLBACK=Zadanie zostało zatrzymane, ponieważ osiągnęło limit wykorzystania zasobów. Niektóre prace mogły zostać wykonane — sprawdź wyniki lub ponów próbę z prostszym żądaniem.
AGENT_SUMMARY_TIMEOUT_FALLBACK=Zadanie zostało zatrzymane po osiągnięciu limitu czasu. Postęp może być niekompletny. Kontynuować działanie czy zatrzymać?

# Authentication
#XMSG Error message for HTTP 401 status
UNAUTHORIZED=Brak uprawnień
#XMSG Error message for HTTP 403 status
FORBIDDEN=Zabronione

# Input validation
#XMSG Error message send to the users client when their message exceeds the limit. {0} = number of allowed characters
MESSAGE_TOO_LONG=Długość komunikatu nie może przekraczać {0} znaków.

# Quota enforcement
QUOTA_CONCURRENT_TASKS=Osiągnięto maksymalną liczbę równoległych zadań ({0}). Spróbuj ponownie później.
QUOTA_CONCURRENT_TASKS_PER_USER=Osiągnięto maksymalną liczbę równoległych zadań na użytkownika ({0}). Spróbuj ponownie później.
QUOTA_TASKS_PER_HOUR=Osiągnięto maksymalną liczbę zadań na godzinę dla tego tenanta ({0}). Spróbuj ponownie później.
QUOTA_TASKS_PER_HOUR_PER_USER=Osiągnięto maksymalną liczbę zadań na godzinę na użytkownika ({0}). Spróbuj ponownie później.
QUOTA_TOOL_CALLS_PER_HOUR=Wykorzystano maksymalną liczbę wywołań narzędzia na godzinę ({0}). Spróbuj ponownie później.
QUOTA_LLM_TOKENS_PER_DAY=Maksymalna liczba tokenów LLM na dziś została już wykorzystana ({0}). Spróbuj ponownie jutro.

# Content filter
CONTENT_FILTER_BLOCKED=Wprowadzone dane zostały zablokowane przez filtr bezpieczeństwa zawartości. Przeformułuj.
CONTENT_FILTER_UNAVAILABLE=Kontrola bezpieczeństwa zawartości jest tymczasowo niedostępna. Spróbuj ponownie.
CONTENT_FILTER_TOOL_BLOCKED=Ostatnie wywołane narzędzie zwróciło szkodliwy wynik. Wypróbuj inny kierunek, aby uniknąć tych samych szkodliwych danych.

# Push notifications
PUSH_URL_NOT_ALLOWED=Adres URL wywołania zwrotnego powiadomienia push ''{0}'' nie znajduje się w dozwolonych domenach: {1}

# HITL
HITL_APPROVE=Zatwierdź
HITL_REJECT=Odrzuć
HITL_CONTINUE=Kontynuuj
HITL_STOP=Zatrzymaj
RESUME_REQUIRES_TEXT=Komunikat wznowienia musi zawierać tekst (np. ''zatwierdź'' lub ''odrzuć'') lub część danych.

# LLM
LLM_UNAVAILABLE=Agent jest chwilowo niedostępny. Spróbuj ponownie później.
