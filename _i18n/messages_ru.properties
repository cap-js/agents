# Agent status messages (shown during task execution)
#XMSG Status info message send to the user client when a tool is called. {0} = tool name
agent_status_calling_tools=Вызов {0}
#XMSG Status info message send to the user client when an entity is being queried. {0} = entity name
agent_status_querying=Запрос {0}
#XMSG Status info message send to the user client after a tool result returned and the agent is processing it
agent_status_processing_response=Обработка ответа инструмента
#XMSG Status info message send to the user client after multiple tool results returned and the agent is processing it
agent_status_processing_responses=Обработка ответов инструмента
agent_status_summarizing_progress=Работа агента прервана. Создается резюме выполненной работы.
AGENT_SUMMARY_QUOTA_FALLBACK=Задача была остановлена, так как достигнут лимит потребления ресурсов. Возможно, часть задачи была выполнена — проверьте результаты или повторите попытку с более простым запросом.
AGENT_SUMMARY_TIMEOUT_FALLBACK=Задача была остановлена, так как достигнут лимит времени. Возможно, задача была выполнена не полностью. Продолжить выполнение или остановить?

# Authentication
#XMSG Error message for HTTP 401 status
UNAUTHORIZED=Нет полномочий
#XMSG Error message for HTTP 403 status
FORBIDDEN=Запрещено

# Input validation
#XMSG Error message send to the users client when their message exceeds the limit. {0} = number of allowed characters
MESSAGE_TOO_LONG=Сообщение теста не должно превышать {0} символов.

# Quota enforcement
QUOTA_CONCURRENT_TASKS=Достигнут максимум одновременных задач ({0}). Повторите попытку позднее.
QUOTA_CONCURRENT_TASKS_PER_USER=Достигнут максимум одновременных задач ({0}) на одного пользователя. Повторите попытку позднее.
QUOTA_TASKS_PER_HOUR=Достигнут максимум задач ({0}) в час для этого арендатора. Повторите попытку позднее.
QUOTA_TASKS_PER_HOUR_PER_USER=Достигнут максимум задач ({0}) в час на одного пользователя. Повторите попытку позднее.
QUOTA_TOOL_CALLS_PER_HOUR=Использовано максимальное число вызовов инструмента в час ({0}). Повторите попытку позднее.
QUOTA_LLM_TOKENS_PER_DAY=Максимальное число маркеров LLM на сегодня ({0}) уже использовано. Повторите попытку завтра.

# Content filter
CONTENT_FILTER_BLOCKED=Введенные данные блокированы фильтром безопасности контента. Перефразируйте.
CONTENT_FILTER_UNAVAILABLE=Проверка безопасности контента временно недоступна. Повторите попытку.
CONTENT_FILTER_TOOL_BLOCKED=Последний вызванный инструмент выдал нежелательный результат. Чтобы избежать появления нежелательных данных, попробуйте другое направление.

# Push notifications
PUSH_URL_NOT_ALLOWED=URL обратного вызова push-уведомления ''{0}'' не в разрешенных доменах: {1}

# HITL
HITL_APPROVE=Утвердить
HITL_REJECT=Отклонить
HITL_CONTINUE=Продолжить
HITL_STOP=Остановить
RESUME_REQUIRES_TEXT=Сообщение резюме должно содержать текст (например, ''утвердить'' или ''отклонить'') или часть данных.

# LLM
LLM_UNAVAILABLE=Агент временно недоступен. Повторите попытку позже.
