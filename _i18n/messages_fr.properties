# Agent status messages (shown during task execution)
#XMSG Status info message send to the user client when a tool is called. {0} = tool name
agent_status_calling_tools=Appel en cours {0}
#XMSG Status info message send to the user client when an entity is being queried. {0} = entity name
agent_status_querying=Requête en cours {0}
#XMSG Status info message send to the user client after a tool result returned and the agent is processing it
agent_status_processing_response=Traitement de la réponse de l''outil en cours
#XMSG Status info message send to the user client after multiple tool results returned and the agent is processing it
agent_status_processing_responses=Traitement des réponses de l''outil en cours
agent_status_summarizing_progress=Agent interrompu. Récapitulatif des progrès réalisés.
AGENT_SUMMARY_QUOTA_FALLBACK=La tâche a été arrêtée car elle a atteint sa limite de consommation de ressources. Une partie du travail demandé a peut-être été effectuée. Vérifiez les résultats ou réessayez avec une demande plus simple.
AGENT_SUMMARY_TIMEOUT_FALLBACK=La tâche a été arrêtée car elle a atteint sa limite de temps. Il est possible que la progression soit incomplète. Poursuivre l''exécution ou arrêter ?

# Authentication
#XMSG Error message for HTTP 401 status
UNAUTHORIZED=Non autorisé
#XMSG Error message for HTTP 403 status
FORBIDDEN=Interdit

# Input validation
#XMSG Error message send to the users client when their message exceeds the limit. {0} = number of allowed characters
MESSAGE_TOO_LONG=Le message ne doit pas dépasser {0} caractères.

# Quota enforcement
QUOTA_CONCURRENT_TASKS=Le nombre maximal de {0} tâches simultanées a été atteint. Réessayez ultérieurement.
QUOTA_CONCURRENT_TASKS_PER_USER=Le nombre maximal de {0} tâches simultanées par utilisateur a été atteint. Réessayez ultérieurement.
QUOTA_TASKS_PER_HOUR=Le nombre maximal de {0} tâches par heure pour ce locataire a été atteint. Réessayez ultérieurement.
QUOTA_TASKS_PER_HOUR_PER_USER=Le nombre maximal de {0} tâches par heure par utilisateur a été atteint. Réessayez ultérieurement.
QUOTA_TOOL_CALLS_PER_HOUR=Le nombre maximum d''appels de l''outil par heure a été utilisé ({0}). Réessayez ultérieurement.
QUOTA_LLM_TOKENS_PER_DAY=La quantité maximale de jetons LLM pour aujourd''hui a déjà été utilisée ({0}). Réessayez demain.

# Content filter
CONTENT_FILTER_BLOCKED=Votre saisie a été bloquée par le filtre de sécurité du contenu. Reformulez.
CONTENT_FILTER_UNAVAILABLE=Le contrôle de sécurité du contenu est temporairement indisponible. Réessayez.
CONTENT_FILTER_TOOL_BLOCKED=Le dernier outil appelé a donné un résultat malveillant. Essayez une requête différente pour éviter les mêmes données malveillantes.

# Push notifications
PUSH_URL_NOT_ALLOWED=L''URL de rappel de notification push "{0}" ne figure pas dans les domaines autorisés : {1}

# HITL
HITL_APPROVE=Approuver
HITL_REJECT=Rejeter
HITL_CONTINUE=Continuer
HITL_STOP=Arrêter
RESUME_REQUIRES_TEXT=Le message de reprise doit contenir du texte (p. ex. "autoriser" ou "refuser") ou une partie de données.

# LLM
LLM_UNAVAILABLE=L''agent est temporairement indisponible. Réessayez plus tard.
