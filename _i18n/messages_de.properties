# Agent status messages (shown during task execution)
#XMSG Status info message send to the user client when a tool is called. {0} = tool name
agent_status_calling_tools={0} wird aufgerufen
#XMSG Status info message send to the user client when an entity is being queried. {0} = entity name
agent_status_querying={0} wird abgefragt
#XMSG Status info message send to the user client after a tool result returned and the agent is processing it
agent_status_processing_response=Tool-Antwort wird verarbeitet...
#XMSG Status info message send to the user client after multiple tool results returned and the agent is processing it
agent_status_processing_responses=Tool-Antworten werden verarbeitet...
agent_status_summarizing_progress=Agent unterbrochen. Fortschritt wird zusammengefasst.
AGENT_SUMMARY_QUOTA_FALLBACK=Die Aufgabe wurde beendet, da das Ressourcen-Limit erreicht wurde. Gegebenenfalls wurden dennoch einige Arbeiten ausgeführt. Überprüfen Sie das Ergebnis oder versuchen Sie es mit einer einfacheren Anforderung erneut.
AGENT_SUMMARY_TIMEOUT_FALLBACK=Die Aufgabe wurde beendet, da das Zeitlimit erreicht wurde. Der Fortschritt ist gegebenenfalls unvollständig. Mit Ausführung fortfahren oder abbrechen?

# Authentication
#XMSG Error message for HTTP 401 status
UNAUTHORIZED=Nicht berechtigt
#XMSG Error message for HTTP 403 status
FORBIDDEN=Unzulässig

# Input validation
#XMSG Error message send to the users client when their message exceeds the limit. {0} = number of allowed characters
MESSAGE_TOO_LONG=Die Meldung darf {0} Zeichen nicht überschreiten.

# Quota enforcement
QUOTA_CONCURRENT_TASKS=Maximum von {0} gleichzeitigen Aufgaben erreicht. Versuchen Sie es später erneut.
QUOTA_CONCURRENT_TASKS_PER_USER=Maximum von {0} gleichzeitigen Aufgaben pro Benutzer erreicht. Versuchen Sie es später erneut.
QUOTA_TASKS_PER_HOUR=Maximum von {0} gleichzeitigen Aufgaben pro Stunde für diesen Tenant erreicht. Versuchen Sie es später erneut.
QUOTA_TASKS_PER_HOUR_PER_USER=Maximum von {0} gleichzeitigen Aufgaben pro Stunde erreicht. Versuchen Sie es später erneut.
QUOTA_TOOL_CALLS_PER_HOUR=Maximale Anzahl an Tool-Aufrufen pro Stunde ({0}) erreicht. Versuchen Sie es später erneut.
QUOTA_LLM_TOKENS_PER_DAY=Maximale Anzahl an LLM-Tokens für heute ({0}) erreicht. Versuchen Sie es morgen erneut.

# Content filter
CONTENT_FILTER_BLOCKED=Eingabe wurde durch den Content-Sicherheitsfilter gesperrt. Bitte umformulieren.
CONTENT_FILTER_UNAVAILABLE=Die Content-Sicherheitsprüfung ist vorübergehend nicht verfügbar. Versuchen Sie es erneut.
CONTENT_FILTER_TOOL_BLOCKED=Das zuletzt aufgerufene Tool lieferte ein bösartiges Ergebnis. Versuchen Sie etwas anderes, um schädliche Daten zu vermeiden.

# Push notifications
PUSH_URL_NOT_ALLOWED=Push-Benachrichtigungs-Callback-URL "{0}" ist nicht in der Liste zulässiger Domänen enthalten: {1}

# HITL
HITL_APPROVE=Genehmigen
HITL_REJECT=Ablehnen
HITL_CONTINUE=Weiter
HITL_STOP=Beenden
RESUME_REQUIRES_TEXT=Die Resume-Nachricht muss Text (z.B. "genehmigen" oder "ablehnen") oder einen Datenteil enthalten.

# LLM
LLM_UNAVAILABLE=Der Agent ist vorübergehend nicht verfügbar. Versuchen Sie es später erneut.
