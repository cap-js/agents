# Agent status messages (shown during task execution)
#XMSG Status info message send to the user client when a tool is called. {0} = tool name
agent_status_calling_tools=Anropar {0}
#XMSG Status info message send to the user client when an entity is being queried. {0} = entity name
agent_status_querying=Frågar {0}
#XMSG Status info message send to the user client after a tool result returned and the agent is processing it
agent_status_processing_response=Bearbetar verktygssvar
#XMSG Status info message send to the user client after multiple tool results returned and the agent is processing it
agent_status_processing_responses=Bearbetar verktygssvar
agent_status_summarizing_progress=Agent avbruten. Sammanfattar progress.
AGENT_SUMMARY_QUOTA_FALLBACK=Uppgiften stoppades eftersom den nådde gränsen för resursförbrukning. En del arbete kan ha utförts – kontrollera resultaten eller försök igen med en enklare begäran.
AGENT_SUMMARY_TIMEOUT_FALLBACK=Uppgiften stoppades eftersom den nådde tidsgränsen. Progressen kan vara ofullständig. Fortsätta köra eller stoppa?

# Authentication
#XMSG Error message for HTTP 401 status
UNAUTHORIZED=Ej auktoriserad
#XMSG Error message for HTTP 403 status
FORBIDDEN=Förbjuden

# Input validation
#XMSG Error message send to the users client when their message exceeds the limit. {0} = number of allowed characters
MESSAGE_TOO_LONG=Ett meddelande får inte överskrida {0} tecken.

# Quota enforcement
QUOTA_CONCURRENT_TASKS=Maxantalet {0} samtidiga uppgifter har nåtts. Försök igen senare.
QUOTA_CONCURRENT_TASKS_PER_USER=Maxantalet {0} samtidiga uppgifter per användare har nåtts. Försök igen senare.
QUOTA_TASKS_PER_HOUR=Maxantalet {0} uppgifter per timme för denna tenant har nåtts. Försök igen senare.
QUOTA_TASKS_PER_HOUR_PER_USER=Maxantalet {0} uppgifter per timme per användare har nåtts. Försök igen senare.
QUOTA_TOOL_CALLS_PER_HOUR=Maximalt antal verktygsanrop per timme har använts ({0}). Försök igen senare.
QUOTA_LLM_TOKENS_PER_DAY=Maximalt antal LLM-token för idag har redan använts ({0}). Försök igen imorgon.

# Content filter
CONTENT_FILTER_BLOCKED=Din inmatning spärrades av innehållssäkerhetsfiltret. Omformulera.
CONTENT_FILTER_UNAVAILABLE=Innehållssäkerhetskontrollen är inte tillgänglig för närvarande. Försök igen.
CONTENT_FILTER_TOOL_BLOCKED=Det senast anropade verktyget gav ett skadligt resultat. Pröva med en annan riktning för att undvika samma skadliga data.

# Push notifications
PUSH_URL_NOT_ALLOWED=Callback-URL ''{0}'' för push-meddelande finns inte i tillåtna domäner: {1}

# HITL
HITL_APPROVE=Godkänn
HITL_REJECT=Avvisa
HITL_CONTINUE=Fortsätt
HITL_STOP=Stoppa
RESUME_REQUIRES_TEXT=Meddelande om återupptagande måste innehålla text (t.ex. "godkänn" eller "avvisa") eller en datadel.

# LLM
LLM_UNAVAILABLE=Agenten är inte tillgänglig för närvarande. Försök igen senare.
