# Agent status messages (shown during task execution)
#XMSG Status info message send to the user client when a tool is called. {0} = tool name
agent_status_calling_tools=جارٍ استدعاء {0}
#XMSG Status info message send to the user client when an entity is being queried. {0} = entity name
agent_status_querying=جارٍ الاستعلام عن {0}
#XMSG Status info message send to the user client after a tool result returned and the agent is processing it
agent_status_processing_response=استجابة أداة المعالجة
#XMSG Status info message send to the user client after multiple tool results returned and the agent is processing it
agent_status_processing_responses=استجابات أداة المعالجة
agent_status_summarizing_progress=تمت مقاطعة الوكيل. جارٍ تلخيص التقدم.
AGENT_SUMMARY_QUOTA_FALLBACK=تم إيقاف المهمة لأنها وصلت إلى حد استهلاك المورد الخاص بها. ربما تم تنفيذ بعض الأعمال - يرجى فحص النتائج أو إعادة المحاولة باستخدام طلب أبسط.
AGENT_SUMMARY_TIMEOUT_FALLBACK=تم إيقاف المهمة لأنها وصلت إلى الحد الزمني المحدد لها. قد يكون التقدم غير مكتمل. هل تريد متابعة التشغيل أو الإيقاف؟

# Authentication
#XMSG Error message for HTTP 401 status
UNAUTHORIZED=غير مفوَّض
#XMSG Error message for HTTP 403 status
FORBIDDEN=ممنوع

# Input validation
#XMSG Error message send to the users client when their message exceeds the limit. {0} = number of allowed characters
MESSAGE_TOO_LONG=يجب ألا تتجاوز الرسالة {0} من الحروف.

# Quota enforcement
QUOTA_CONCURRENT_TASKS=تم الوصول إلى الحد الأقصى البالغ {0} من المهام المتزامنة. يرجى المحاولة مرة أخرى لاحقًا.
QUOTA_CONCURRENT_TASKS_PER_USER=تم الوصول إلى الحد الأقصى البالغ {0} من المهام المتزامنة لكل مستخدم. يرجى إعادة المحاولة لاحقًا.
QUOTA_TASKS_PER_HOUR=تم الوصول إلى الحد الأقصى البالغ {0} من المهام لكل ساعة لهذه الوحدة المستضافة. يرجى المحاولة مرة أخرى لاحقًا.
QUOTA_TASKS_PER_HOUR_PER_USER=تم الوصول إلى الحد الأقصى البالغ {0} من المهام لكل ساعة لكل مستخدم. يرجى إعادة المحاولة لاحقًا.
QUOTA_TOOL_CALLS_PER_HOUR=تم استخدام الحد الأقصى لعدد استدعاءات الأدوات لكل ساعة ({0}). يرجى المحاولة مرة أخرى لاحقًا.
QUOTA_LLM_TOKENS_PER_DAY=تم استخدام الحد الأقصى لعدد الرموز المميزة لنموذج اللغة الكبير (LLM) لليوم بالفعل ({0}). يرجى المحاولة مرة أخرى غدًا.

# Content filter
CONTENT_FILTER_BLOCKED=تم إيقاف إدخالك بواسطة عامل تصفية سلامة المحتوى. يرجى إعادة الصياغة.
CONTENT_FILTER_UNAVAILABLE=فحص سلامة المحتوى غير متوفر مؤقتًا. يرجى المحاولة مرة أخرى.
CONTENT_FILTER_TOOL_BLOCKED=أسفرت آخر أداة تم استدعاؤها عن نتيجة ضارة. يرجى تجربة اتجاه مختلف لتجنب البيانات الضارة نفسها.

# Push notifications
PUSH_URL_NOT_ALLOWED=رابط إعادة استدعاء الإشعار المؤقت ''{0}'' غير موجود في المجالات المسموح بها: {1}

# HITL
HITL_APPROVE=اعتماد
HITL_REJECT=رفض
HITL_CONTINUE=متابعة
HITL_STOP=إيقاف
RESUME_REQUIRES_TEXT=يجب أن تحتوي رسالة الاستئناف على نص (على سبيل المثال، ''اعتماد'' أو ''رفض'') أو جزء بيانات.

# LLM
LLM_UNAVAILABLE=الوكيل غير متوفر مؤقتًا. يرجى المحاولة مرة أخرى لاحقًا.
