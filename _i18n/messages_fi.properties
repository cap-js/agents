# Agent status messages (shown during task execution)
#XMSG Status info message send to the user client when a tool is called. {0} = tool name
agent_status_calling_tools=Kutsutaan {0}
#XMSG Status info message send to the user client when an entity is being queried. {0} = entity name
agent_status_querying=Kysellään kohdetta {0}
#XMSG Status info message send to the user client after a tool result returned and the agent is processing it
agent_status_processing_response=Käsittelytyökalun vastaus
#XMSG Status info message send to the user client after multiple tool results returned and the agent is processing it
agent_status_processing_responses=Käsittelytyökalun vastaukset
agent_status_summarizing_progress=Agentti keskeytetty. Tehdään yhteenvetoa edistymisestä.
AGENT_SUMMARY_QUOTA_FALLBACK=Tehtävä pysäytettiin, koska sen resurssikulutuksen raja saavutettiin. Joitakin töitä on saatettu tehdä — tarkista tulokset tai yritä uudelleen yksinkertaisemmalla pyynnöllä.
AGENT_SUMMARY_TIMEOUT_FALLBACK=Tehtävä pysäytettiin, koska se saavutti aikarajoituksensa. Edistyminen voi olla puutteellista. Jatketaanko suoritusta vai pysäytetäänkö?

# Authentication
#XMSG Error message for HTTP 401 status
UNAUTHORIZED=Ei-oikeutettu
#XMSG Error message for HTTP 403 status
FORBIDDEN=Kielletty

# Input validation
#XMSG Error message send to the users client when their message exceeds the limit. {0} = number of allowed characters
MESSAGE_TOO_LONG=Viesti ei saa ylittää {0} merkkiä.

# Quota enforcement
QUOTA_CONCURRENT_TASKS=Rinnakkaisten tehtävien {0} maksimimäärä on saavutettu. Yritä myöhemmin uudelleen.
QUOTA_CONCURRENT_TASKS_PER_USER=Rinnakkaisten tehtävien {0} maksimimäärä käyttäjää kohti on saavutettu. Yritä myöhemmin uudelleen.
QUOTA_TASKS_PER_HOUR=Tämän vuokralaisen rinnakkaisten tehtävien {0} maksimimäärä on saavutettu. Yritä myöhemmin uudelleen.
QUOTA_TASKS_PER_HOUR_PER_USER=Tehtävien {0} maksimimäärä käyttäjää kohti on saavutettu. Yritä myöhemmin uudelleen.
QUOTA_TOOL_CALLS_PER_HOUR=Työkalukutsujen tuntikohtainen maksimimäärä on käytetty ({0}). Yritä myöhemmin uudelleen.
QUOTA_LLM_TOKENS_PER_DAY=Tämän päivän LLM-tunnisteiden maksimimäärä on jo käytetty ({0}). Yritä uudelleen huomenna.

# Content filter
CONTENT_FILTER_BLOCKED=Sisällön turvallisuussuodatin lukitsi syöttämäsi tiedot. Muotoile uudelleen.
CONTENT_FILTER_UNAVAILABLE=Sisällön turvallisuustarkistus on tilapäisesti poissa käytöstä. Yritä uudelleen.
CONTENT_FILTER_TOOL_BLOCKED=Viimeksi kutsuttu työkalu tuotti haitallista tietoa. Yritä eri suuntaa välttääksesi samat haitalliset tiedot.

# Push notifications
PUSH_URL_NOT_ALLOWED=Push-ilmoituksen takaisinkutsun URL "{0}" ei ole sallituilla alueilla: {1}

# HITL
HITL_APPROVE=Hyväksy
HITL_REJECT=Hylkää
HITL_CONTINUE=Jatka
HITL_STOP=Pysäytä
RESUME_REQUIRES_TEXT=Jatkamista koskevan viestin on sisällettävä tekstiä (esim. "hyväksy" tai "hylkää") tai tieto-osa.

# LLM
LLM_UNAVAILABLE=Agentti on väliaikaisesti pois käytöstä. Yritä myöhemmin uudelleen.
