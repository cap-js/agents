# Agent status messages (shown during task execution)
#XMSG Status info message send to the user client when a tool is called. {0} = tool name
agent_status_calling_tools=Sedang memanggil {0}
#XMSG Status info message send to the user client when an entity is being queried. {0} = entity name
agent_status_querying=Sedang membuat pertanyaan {0}
#XMSG Status info message send to the user client after a tool result returned and the agent is processing it
agent_status_processing_response=Memproses maklum balas alat
#XMSG Status info message send to the user client after multiple tool results returned and the agent is processing it
agent_status_processing_responses=Memproses maklum balas alat
agent_status_summarizing_progress=Agen terganggu. Sedang meringkaskan kemajuan.
AGENT_SUMMARY_QUOTA_FALLBACK=Tugas dihentikan kerana ia telah mencapai had penggunaan sumbernya. Beberapa kerja mungkin telah selesai — sila semak hasil atau cuba semula dengan permintaan yang lebih mudah.
AGENT_SUMMARY_TIMEOUT_FALLBACK=Tugas dihentikan kerana telah mencapai had masa. Kemajuan mungkin tidak lengkap. Teruskan atau hentikan jalanan?

# Authentication
#XMSG Error message for HTTP 401 status
UNAUTHORIZED=Tidak Dibenarkan
#XMSG Error message for HTTP 403 status
FORBIDDEN=Dilarang

# Input validation
#XMSG Error message send to the users client when their message exceeds the limit. {0} = number of allowed characters
MESSAGE_TOO_LONG=Mesej mesti tidak melebihi {0} aksara.

# Quota enforcement
QUOTA_CONCURRENT_TASKS=Maksimum {0} tugas serentak telah dicapai. Sila cuba lagi kemudian.
QUOTA_CONCURRENT_TASKS_PER_USER=Maksimum {0} tugas serentak setiap pengguna telah dicapai. Sila cuba lagi kemudian.
QUOTA_TASKS_PER_HOUR=Maksimum {0} tugas setiap jam untuk penyewa ini telah dicapai. Sila cuba lagi kemudian.
QUOTA_TASKS_PER_HOUR_PER_USER=Maksimum {0} tugas setiap jam bagi setiap pengguna telah dicapai. Sila cuba lagi kemudian.
QUOTA_TOOL_CALLS_PER_HOUR=Amaun maksimum panggilan alat setiap jam digunakan ({0}). Sila cuba lagi kemudian.
QUOTA_LLM_TOKENS_PER_DAY=Amaun maksimum token LLM untuk hari ini telah digunakan ({0}). Sila cuba lagi esok.

# Content filter
CONTENT_FILTER_BLOCKED=Input anda telah disekat oleh penapis keselamatan kandungan. Sila ungkapkan semula.
CONTENT_FILTER_UNAVAILABLE=Semakan keselamatan kandungan tidak tersedia buat sementara waktu. Sila cuba lagi.
CONTENT_FILTER_TOOL_BLOCKED=Alat terakhir yang dipanggil memberikan hasil berhasad. Sila cuba arah yang berbeza untuk mengelakkan data hasad yang sama.

# Push notifications
PUSH_URL_NOT_ALLOWED=URL panggilan balik pemberitahuan tolak ''{0}'' bukan dalam domain yang dibenarkan: {1}

# HITL
HITL_APPROVE=Luluskan
HITL_REJECT=Tolak
HITL_CONTINUE=Teruskan
HITL_STOP=Hentikan
RESUME_REQUIRES_TEXT=Mesej sambung semula mesti mengandungi teks (contohnya, ''luluskan'' atau ''tolak'') atau bahagian data.

# LLM
LLM_UNAVAILABLE=Ejen tidak tersedia buat sementara waktu. Sila cuba lagi kemudian.
