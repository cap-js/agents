# Agent status messages (shown during task execution)
#XMSG Status info message send to the user client when a tool is called. {0} = tool name
agent_status_calling_tools=Đang gọi {0}
#XMSG Status info message send to the user client when an entity is being queried. {0} = entity name
agent_status_querying=Đang truy vấn {0}
#XMSG Status info message send to the user client after a tool result returned and the agent is processing it
agent_status_processing_response=Đang xử lý phản hồi của công cụ
#XMSG Status info message send to the user client after multiple tool results returned and the agent is processing it
agent_status_processing_responses=Đang xử lý phản hồi của công cụ
agent_status_summarizing_progress=Tác nhân bị gián đoạn. Đang tóm tắt tiến độ.
AGENT_SUMMARY_QUOTA_FALLBACK=Tác vụ này đã bị dừng vì đã đạt đến giới hạn tiêu thụ tài nguyên. Một số công việc có thể đã hoàn tất – vui lòng kiểm tra kết quả hoặc thử lại với yêu cầu đơn giản hơn.
AGENT_SUMMARY_TIMEOUT_FALLBACK=Tác vụ này đã bị dừng vì đã đạt đến giới hạn thời gian. Tiến độ có thể chưa hoàn tất. Tiếp tục chạy hay dừng?

# Authentication
#XMSG Error message for HTTP 401 status
UNAUTHORIZED=Không được phân quyền
#XMSG Error message for HTTP 403 status
FORBIDDEN=Bị cấm

# Input validation
#XMSG Error message send to the users client when their message exceeds the limit. {0} = number of allowed characters
MESSAGE_TOO_LONG=Thông báo không được vượt quá {0} ký tự.

# Quota enforcement
QUOTA_CONCURRENT_TASKS=Đã đạt đến mức tối đa {0} tác vụ đồng thời. Vui lòng thử lại sau.
QUOTA_CONCURRENT_TASKS_PER_USER=Đã đạt đến mức tối đa {0} tác vụ đồng thời cho mỗi người dùng. Vui lòng thử lại sau.
QUOTA_TASKS_PER_HOUR=Đã đạt đến mức tối đa {0} tác vụ mỗi giờ cho đối tượng thuê này. Vui lòng thử lại sau.
QUOTA_TASKS_PER_HOUR_PER_USER=Đã đạt đến mức tối đa {0} tác vụ mỗi giờ cho mỗi người dùng. Vui lòng thử lại sau.
QUOTA_TOOL_CALLS_PER_HOUR=Đã sử dụng hết số lượng lệnh gọi công cụ tối đa mỗi giờ ({0}). Vui lòng thử lại sau.
QUOTA_LLM_TOKENS_PER_DAY=Đã sử dụng hết số lượng mã thông báo LLM tối đa cho ngày hôm nay ({0}). Vui lòng thử lại vào ngày mai.

# Content filter
CONTENT_FILTER_BLOCKED=Bộ lọc an toàn nội dung đã chặn đầu vào của bạn. Vui lòng diễn đạt lại.
CONTENT_FILTER_UNAVAILABLE=Tính năng kiểm tra an toàn nội dung tạm thời không hoạt động. Vui lòng thử lại.
CONTENT_FILTER_TOOL_BLOCKED=Công cụ cuối cùng được gọi đã tạo ra kết quả độc hại. Hãy thử một hướng khác để tránh dữ liệu độc hại tương tự.

# Push notifications
PUSH_URL_NOT_ALLOWED=URL gọi lại thông báo đẩy "{0}" không thuộc các miền được phép: {1}

# HITL
HITL_APPROVE=Phê duyệt
HITL_REJECT=Từ chối
HITL_CONTINUE=Tiếp tục
HITL_STOP=Dừng
RESUME_REQUIRES_TEXT=Thông báo tiếp tục phải chứa văn bản (ví dụ: "phê duyệt" hoặc "từ chối") hay phần dữ liệu.

# LLM
LLM_UNAVAILABLE=Tác nhân tạm thời không khả dụng. Vui lòng thử lại sau.
