# Agent status messages (shown during task execution)
#XMSG Status info message send to the user client when a tool is called. {0} = tool name
agent_status_calling_tools={0} wordt opgeroepen
#XMSG Status info message send to the user client when an entity is being queried. {0} = entity name
agent_status_querying=Query wordt uitgevoerd voor {0}
#XMSG Status info message send to the user client after a tool result returned and the agent is processing it
agent_status_processing_response=Antwoord van tool wordt verwerkt
#XMSG Status info message send to the user client after multiple tool results returned and the agent is processing it
agent_status_processing_responses=Antwoorden van tool worden verwerkt
agent_status_summarizing_progress=Agent onderbroken. Voortgang wordt samengevat.
AGENT_SUMMARY_QUOTA_FALLBACK=De taak is gestopt omdat de resourceverbruikslimiet is bereikt. Er is mogelijk werk verricht. Controleer de resultaten of probeer het opnieuw met een eenvoudiger verzoek.
AGENT_SUMMARY_TIMEOUT_FALLBACK=De taak is gestopt omdat de tijdslimiet is bereikt. De voortgang is mogelijk onvolledig. Doorgaan met uitvoeren of stoppen?

# Authentication
#XMSG Error message for HTTP 401 status
UNAUTHORIZED=Niet geautoriseerd
#XMSG Error message for HTTP 403 status
FORBIDDEN=Verboden

# Input validation
#XMSG Error message send to the users client when their message exceeds the limit. {0} = number of allowed characters
MESSAGE_TOO_LONG=Het bericht mag niet langer zijn dan {0} tekens.

# Quota enforcement
QUOTA_CONCURRENT_TASKS=Het maximum van {0} gelijktijdige taken is bereikt. Probeer het later opnieuw.
QUOTA_CONCURRENT_TASKS_PER_USER=Het maximum van {0} gelijktijdige taken per gebruiker is bereikt. Probeer het later opnieuw.
QUOTA_TASKS_PER_HOUR=Het maximum van {0} gelijktijdige taken per uur voor deze tenant is bereikt. Probeer het later opnieuw.
QUOTA_TASKS_PER_HOUR_PER_USER=Het maximum van {0} gelijktijdige taken per uur per gebruiker is bereikt. Probeer het later opnieuw.
QUOTA_TOOL_CALLS_PER_HOUR=Het maximale aantal tooloproepen per uur is gebruikt ({0}). Probeer het later opnieuw.
QUOTA_LLM_TOKENS_PER_DAY=Het maximale aantal LLM-tokens voor vandaag is al gebruikt ({0}). Probeer het morgen opnieuw.

# Content filter
CONTENT_FILTER_BLOCKED=Uw invoer is geblokkeerd door de inhoudsveiligheidsfilter. Formuleer uw invoer anders.
CONTENT_FILTER_UNAVAILABLE=Deze website is tijdelijk niet beschikbaar i.v.m. werkzaamheden. Probeer het opnieuw.
CONTENT_FILTER_TOOL_BLOCKED=De laatste opgeroepen tool leverde een kwaadwillend resultaat op. Probeer een andere richting om dezelfde schadelijke gegevens te voorkomen.

# Push notifications
PUSH_URL_NOT_ALLOWED=Callback-URL pushmelding ''{0}'' niet in toegestane domeinen: {1}

# HITL
HITL_APPROVE=Goedkeuren
HITL_REJECT=Afwijzen
HITL_CONTINUE=Doorgaan
HITL_STOP=Stoppen
RESUME_REQUIRES_TEXT=Hervattingsbericht moet tekst bevatten (bijv. ''goedkeuren'' of ''afwijzen''), of een gegevensdeel.

# LLM
LLM_UNAVAILABLE=Deze agent is tijdelijk niet beschikbaar. Probeer het later opnieuw.
