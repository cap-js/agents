# Agent status messages (shown during task execution)
#XMSG Status info message send to the user client when a tool is called. {0} = tool name
agent_status_calling_tools=Anroper {0}
#XMSG Status info message send to the user client when an entity is being queried. {0} = entity name
agent_status_querying=Spør {0}
#XMSG Status info message send to the user client after a tool result returned and the agent is processing it
agent_status_processing_response=Behandler verktøysvar
#XMSG Status info message send to the user client after multiple tool results returned and the agent is processing it
agent_status_processing_responses=Behandler verktøysvar
agent_status_summarizing_progress=Agent avbrutt. Oppsummerer fremdrift.
AGENT_SUMMARY_QUOTA_FALLBACK=Oppgaven ble stoppet fordi den nådde grensen for ressursforbruket. Noe arbeid kan ha blitt gjort — sjekk resultatene eller prøv igjen med en enklere forespørsel.
AGENT_SUMMARY_TIMEOUT_FALLBACK=Oppgaven ble stoppet fordi den nådde tidsgrensen. Fremdriften kan være ufullstendig. Fortsette kjøringen eller stoppe?

# Authentication
#XMSG Error message for HTTP 401 status
UNAUTHORIZED=Ikke autorisert
#XMSG Error message for HTTP 403 status
FORBIDDEN=Ikke tillatt

# Input validation
#XMSG Error message send to the users client when their message exceeds the limit. {0} = number of allowed characters
MESSAGE_TOO_LONG=Meldingen kan ikke overskride {0} tegn.

# Quota enforcement
QUOTA_CONCURRENT_TASKS=Grensen på {0} samtidige oppgaver er nådd. Prøv igjen senere.
QUOTA_CONCURRENT_TASKS_PER_USER=Grensen på {0} samtidige oppgaver per bruker er nådd. Prøv igjen senere.
QUOTA_TASKS_PER_HOUR=Grensen på {0} oppgaver per time for denne tenanten er nådd. Prøv igjen senere.
QUOTA_TASKS_PER_HOUR_PER_USER=Grensen på {0} oppgaver per time per bruker er nådd. Prøv igjen senere.
QUOTA_TOOL_CALLS_PER_HOUR=Det maksimale antallet verktøyanrop pr. time er nådd ({0}). Prøv igjen senere.
QUOTA_LLM_TOKENS_PER_DAY=Det maksimale antallet LLM-token for i dag er allerede nådd ({0}). Prøv igjen i morgen.

# Content filter
CONTENT_FILTER_BLOCKED=Inndataene dine ble sperret av sikkerhetsfilteret for innhold. Omformuler.
CONTENT_FILTER_UNAVAILABLE=Sikkerhetskontrollen av innholdet er midlertidig utilgjengelig. Prøv igjen.
CONTENT_FILTER_TOOL_BLOCKED=Det siste verktøyet som ble anropt, ga et skadelig resultat. Prøv en annen retning for å unngå de samme skadelige dataene.

# Push notifications
PUSH_URL_NOT_ALLOWED=Tilbakeringings-URL ''{0}'' for pushvarsel er ikke i tillatte domener: {1}

# HITL
HITL_APPROVE=Godkjenn
HITL_REJECT=Avvis
HITL_CONTINUE=Fortsett
HITL_STOP=Stopp
RESUME_REQUIRES_TEXT=Gjenoppta-meldingen må inneholde tekst (f.eks. ''godkjenn'' eller ''avvis'') eller en datadel.

# LLM
LLM_UNAVAILABLE=Agenten er ikke tilgjengelig for øyeblikket. Prøv igjen senere.
