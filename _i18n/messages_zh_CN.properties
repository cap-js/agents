# Agent status messages (shown during task execution)
#XMSG Status info message send to the user client when a tool is called. {0} = tool name
agent_status_calling_tools=正在调用 {0}
#XMSG Status info message send to the user client when an entity is being queried. {0} = entity name
agent_status_querying=正在查询 {0}
#XMSG Status info message send to the user client after a tool result returned and the agent is processing it
agent_status_processing_response=正在处理工具响应
#XMSG Status info message send to the user client after multiple tool results returned and the agent is processing it
agent_status_processing_responses=正在处理工具响应
agent_status_summarizing_progress=代理已中断。正在汇总进度。
AGENT_SUMMARY_QUOTA_FALLBACK=该任务因达到资源消耗限制而停止。部分工作可能已完成 - 请检查结果，或使用更简单的请求重试。
AGENT_SUMMARY_TIMEOUT_FALLBACK=该任务因达到时间限制而停止。进度可能不完整。是继续运行还是停止？

# Authentication
#XMSG Error message for HTTP 401 status
UNAUTHORIZED=未授权
#XMSG Error message for HTTP 403 status
FORBIDDEN=已禁止

# Input validation
#XMSG Error message send to the users client when their message exceeds the limit. {0} = number of allowed characters
MESSAGE_TOO_LONG=消息不得超过 {0} 个字符。

# Quota enforcement
QUOTA_CONCURRENT_TASKS=已达到最大并发任务数 {0}。请稍后重试。
QUOTA_CONCURRENT_TASKS_PER_USER=已达到每个用户的最大并发任务数 {0}。请稍后重试。
QUOTA_TASKS_PER_HOUR=已达到此租户的每小时最大任务数 {0}。请稍后重试。
QUOTA_TASKS_PER_HOUR_PER_USER=已达到每个用户每小时的最大任务数 {0}。请稍后重试。
QUOTA_TOOL_CALLS_PER_HOUR=已达到每小时的最大工具调用次数 ({0})。请稍后重试。
QUOTA_LLM_TOKENS_PER_DAY=已达到今天的 LLM 令牌最大使用数量 ({0})。请明天再试。

# Content filter
CONTENT_FILTER_BLOCKED=您的输入已被内容安全过滤器拦截。请重新表述。
CONTENT_FILTER_UNAVAILABLE=内容安全检查暂时不可用。请重试。
CONTENT_FILTER_TOOL_BLOCKED=最后调用的工具返回了恶意结果。请尝试其他方向，以避免再次遇到相同的恶意数据。

# Push notifications
PUSH_URL_NOT_ALLOWED=推送通知回调 URL ''{0}'' 不在允许的域中：{1}

# HITL
HITL_APPROVE=批准
HITL_REJECT=拒绝
HITL_CONTINUE=继续
HITL_STOP=停止
RESUME_REQUIRES_TEXT=恢复消息必须包含文本（例如“批准”或“拒绝”）或数据部分。

# LLM
LLM_UNAVAILABLE=代理暂时不可用。请稍后重试。
