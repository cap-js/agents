# Agent status messages (shown during task execution)
#XMSG Status info message send to the user client when a tool is called. {0} = tool name
agent_status_calling_tools=Volající {0}
#XMSG Status info message send to the user client when an entity is being queried. {0} = entity name
agent_status_querying=Dotazující {0}
#XMSG Status info message send to the user client after a tool result returned and the agent is processing it
agent_status_processing_response=Zpracovává se reakce nástroje
#XMSG Status info message send to the user client after multiple tool results returned and the agent is processing it
agent_status_processing_responses=Zpracovávají se reakce nástroje
agent_status_summarizing_progress=Agent byl přerušen. Shrnuje se pokrok.
AGENT_SUMMARY_QUOTA_FALLBACK=Úloha byla zastavena, protože dosáhla limitu spotřeby zdrojů. Některé práce byly možná provedeny – zkontrolujte výsledky nebo zkuste to znovu s jednodušším požadavkem.
AGENT_SUMMARY_TIMEOUT_FALLBACK=Úloha byla zastavena, protože dosáhla svého časového limitu. Pokrok může být neúplný. Pokračovat, nebo zastavit?

# Authentication
#XMSG Error message for HTTP 401 status
UNAUTHORIZED=Neautorizováno
#XMSG Error message for HTTP 403 status
FORBIDDEN=Zakázáno

# Input validation
#XMSG Error message send to the users client when their message exceeds the limit. {0} = number of allowed characters
MESSAGE_TOO_LONG=Zpráva nesmí překročit {0} znaků.

# Quota enforcement
QUOTA_CONCURRENT_TASKS=Bylo dosaženo maximálního počtu {0} souběžných úloh. Zkuste to znovu později.
QUOTA_CONCURRENT_TASKS_PER_USER=Bylo dosaženo maximálního počtu {0} souběžných úloh na uživatele. Zkuste to znovu později.
QUOTA_TASKS_PER_HOUR=Bylo dosaženo maximálního počtu {0} úloh za hodinu pro tohoto tenanta. Zkuste to znovu později.
QUOTA_TASKS_PER_HOUR_PER_USER=Bylo dosaženo maximálního počtu {0} úloh za hodinu na uživatele. Zkuste to znovu později.
QUOTA_TOOL_CALLS_PER_HOUR=Bylo použito maximální množství volání nástrojů za hodinu ({0}). Zkuste to znovu později.
QUOTA_LLM_TOKENS_PER_DAY=Maximální počet tokenů LLM pro dnešek byl již použit ({0}). Zkuste to znovu zítra.

# Content filter
CONTENT_FILTER_BLOCKED=Váš vstup byl blokován bezpečnostním filtrem obsahu. Změňte prosím formulaci.
CONTENT_FILTER_UNAVAILABLE=Kontrola bezpečnosti obsahu je dočasně nedostupná. Zkuste to znovu.
CONTENT_FILTER_TOOL_BLOCKED=Poslední volaný nástroj vrátil škodlivý výsledek. Zkuste jiný směr, abyste předešli stejným škodlivým datům.

# Push notifications
PUSH_URL_NOT_ALLOWED=URL zpětného volání oznámení push ''{0}'' není povoleno v doménách: {1}

# HITL
HITL_APPROVE=Schválit
HITL_REJECT=Zamítnout
HITL_CONTINUE=Pokračovat
HITL_STOP=Zastavit
RESUME_REQUIRES_TEXT=Zpráva o pokračování musí obsahovat text (např. ''schválit'' nebo ''zamítnout'') nebo datovou část.

# LLM
LLM_UNAVAILABLE=Agent je dočasně nedostupný. Pokuste se prosím znovu později.
