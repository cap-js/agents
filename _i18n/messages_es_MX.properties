# Agent status messages (shown during task execution)
#XMSG Status info message send to the user client when a tool is called. {0} = tool name
agent_status_calling_tools=Llamando {0}
#XMSG Status info message send to the user client when an entity is being queried. {0} = entity name
agent_status_querying=Consultando {0}
#XMSG Status info message send to the user client after a tool result returned and the agent is processing it
agent_status_processing_response=Procesando respuesta de la herramienta
#XMSG Status info message send to the user client after multiple tool results returned and the agent is processing it
agent_status_processing_responses=Procesando respuestas de la herramienta
agent_status_summarizing_progress=Agente interrumpido. Resumiendo el progreso.
AGENT_SUMMARY_QUOTA_FALLBACK=La tarea se ha detenido porque ha alcanzado su límite de consumo de recursos. Es posible que se haya realizado algún trabajo; verifique los resultados o inténtelo de nuevo con una solicitud más sencilla.
AGENT_SUMMARY_TIMEOUT_FALLBACK=La tarea se ha detenido porque ha alcanzado su límite de tiempo. Es posible que el progreso esté incompleto. ¿Continuar ejecutándose o detenerse?

# Authentication
#XMSG Error message for HTTP 401 status
UNAUTHORIZED=No autorizado
#XMSG Error message for HTTP 403 status
FORBIDDEN=Prohibido

# Input validation
#XMSG Error message send to the users client when their message exceeds the limit. {0} = number of allowed characters
MESSAGE_TOO_LONG=El mensaje no debe superar los {0} caracteres.

# Quota enforcement
QUOTA_CONCURRENT_TASKS=Se ha alcanzado el máximo de {0} tareas simultáneas. Inténtelo de nuevo más tarde.
QUOTA_CONCURRENT_TASKS_PER_USER=Se ha alcanzado el máximo de {0} tareas simultáneas por usuario. Inténtelo de nuevo más tarde.
QUOTA_TASKS_PER_HOUR=Se ha alcanzado el máximo de {0} tareas por hora para este arrendatario. Inténtelo de nuevo más tarde.
QUOTA_TASKS_PER_HOUR_PER_USER=Se ha alcanzado el máximo de {0} tareas por hora por usuario. Inténtelo de nuevo más tarde.
QUOTA_TOOL_CALLS_PER_HOUR=Se ha utilizado la cantidad máxima de llamadas de herramienta por hora ({0}). Inténtelo de nuevo más tarde.
QUOTA_LLM_TOKENS_PER_DAY=La cantidad máxima de tokens LLM para hoy ya se ha utilizado ({0}). Inténtelo de nuevo mañana.

# Content filter
CONTENT_FILTER_BLOCKED=Su entrada ha sido bloqueada por el filtro de seguridad de contenido. Reformule la frase.
CONTENT_FILTER_UNAVAILABLE=La verificación de seguridad del contenido no está disponible temporalmente. Inténtelo de nuevo.
CONTENT_FILTER_TOOL_BLOCKED=La última herramienta llamada a devuelto un resultado malicioso. Intente con una dirección diferente para evitar los mismos datos maliciosos.

# Push notifications
PUSH_URL_NOT_ALLOWED=La URL de llamada de retorno de notificación push ''{0}'' no está en los dominios permitidos: {1}

# HITL
HITL_APPROVE=Aprobar
HITL_REJECT=Rechazar
HITL_CONTINUE=Continuar
HITL_STOP=Detener
RESUME_REQUIRES_TEXT=El mensaje de reanudación debe contener texto (p. ej. ''autorizar'' o ''rechazar'') o una parte de datos.

# LLM
LLM_UNAVAILABLE=El agente no está disponible temporalmente. Inténtelo de nuevo más tarde.
