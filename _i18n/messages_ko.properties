# Agent status messages (shown during task execution)
#XMSG Status info message send to the user client when a tool is called. {0} = tool name
agent_status_calling_tools={0} 호출 중
#XMSG Status info message send to the user client when an entity is being queried. {0} = entity name
agent_status_querying={0} 쿼리 중
#XMSG Status info message send to the user client after a tool result returned and the agent is processing it
agent_status_processing_response=툴 응답 처리 중
#XMSG Status info message send to the user client after multiple tool results returned and the agent is processing it
agent_status_processing_responses=툴 응답 처리 중
agent_status_summarizing_progress=에이전트가 중단되었습니다. 진행 상황을 요약하고 있습니다.
AGENT_SUMMARY_QUOTA_FALLBACK=리소스 사용 한도에 도달하여 태스크가 중지되었습니다. 일부 작업이 완료되었을 수 있습니다. 결과를 확인하거나 더 간단한 요청으로 다시 시도하십시오.
AGENT_SUMMARY_TIMEOUT_FALLBACK=시간 제한에 도달하여 태스크가 중지되었습니다. 진행이 완료되지 않을 수 있습니다. 계속 실행하시겠습니까, 아니면 중지하시겠습니까?

# Authentication
#XMSG Error message for HTTP 401 status
UNAUTHORIZED=권한 없음
#XMSG Error message for HTTP 403 status
FORBIDDEN=금지됨

# Input validation
#XMSG Error message send to the users client when their message exceeds the limit. {0} = number of allowed characters
MESSAGE_TOO_LONG=메시지는 {0}자를 초과해서는 안 됩니다.

# Quota enforcement
QUOTA_CONCURRENT_TASKS=최대 동시 태스크 수인 {0}개에 도달했습니다. 나중에 다시 시도하십시오.
QUOTA_CONCURRENT_TASKS_PER_USER=사용자당 최대 동시 태스크 수인 {0}개에 도달했습니다. 나중에 다시 시도하십시오.
QUOTA_TASKS_PER_HOUR=이 테넌트에 대한 시간당 최대 태스크 수인 {0}개에 도달했습니다. 나중에 다시 시도하십시오.
QUOTA_TASKS_PER_HOUR_PER_USER=사용자별 시간당 최대 태스크 수인 {0}개에 도달했습니다. 나중에 다시 시도하십시오.
QUOTA_TOOL_CALLS_PER_HOUR=시간당 최대 툴 호출 수를 사용했습니다({0}). 나중에 다시 시도하십시오.
QUOTA_LLM_TOKENS_PER_DAY=오늘의 최대 LLM 토큰 양을 이미 사용했습니다({0}). 내일 다시 시도하십시오.

# Content filter
CONTENT_FILTER_BLOCKED=컨텐트 안전 필터에 의해 입력이 차단되었습니다. 다시 입력해 주십시오.
CONTENT_FILTER_UNAVAILABLE=컨텐트 안전 점검을 일시적으로 사용할 수 없습니다. 다시 시도하십시오.
CONTENT_FILTER_TOOL_BLOCKED=마지막으로 호출된 툴에서 악성 결과를 반환했습니다. 동일한 악성 데이터를 피하기 위해 다른 방식을 시도해 보십시오.

# Push notifications
PUSH_URL_NOT_ALLOWED=푸시 알림 콜백 URL ''{0}''이(가) 허용된 도메인에 없음: {1}

# HITL
HITL_APPROVE=승인
HITL_REJECT=거부
HITL_CONTINUE=계속
HITL_STOP=중지
RESUME_REQUIRES_TEXT=재개 메시지에는 텍스트(예: ''승인'' 또는 ''거부'')나 데이터 부분이 포함되어야 합니다.

# LLM
LLM_UNAVAILABLE=에이전트를 일시적으로 사용할 수 없습니다. 나중에 다시 시도하십시오.
