name: Release

on:
  workflow_dispatch:

concurrency:
  group: release-${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  XMAKE_PROJECT_ID: ght-cap-a2a
  XMAKE_RELEASE_MODE: stage_and_promote

jobs:
  test:
    runs-on: [self-hosted, solinas]
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        node-version: [20.x, 22.x]
        cds-version: [latest]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: ${{ matrix.node-version }}
      - name: Configure internal registry
        run: |
          echo "@cap-js:registry=https://int.repositories.cloud.sap/artifactory/api/npm/build-releases-npm/" >> .npmrc
          echo "//int.repositories.cloud.sap/artifactory/api/npm/build-releases-npm/:_authToken=${{ secrets.NPM_REGISTRY_TOKEN }}" >> .npmrc
      - run: npm i -g @sap/cds-dk@${{ matrix.cds-version }}
      - run: npm i
      - run: cd tests/bookshop && npm i
      - run: node --experimental-vm-modules node_modules/jest/bin/jest.js

  # Pre-release: upload test results and run BlackDuck scans
  upload-test-results:
    uses: cap/.github/.github/workflows/pre-release.yml@87c2db57786c5525a56271a7370075ff0cf20a3d # main
    secrets:
      cumulus-token: ${{ secrets.CUMULUS_TOKEN_CDS_UMBRELLA }}
    with:
      # TODO: Replace with actual Cumulus pipeline ID once registered
      cumulus-pipeline-id: "TBD"
      cobertura-file: "coverage/cobertura-coverage.xml"
      junit-file: "junit.xml"
      release-branch: "release"
      npm-script: "test:reporting"

  blackduck-scans:
    uses: cap/.github/.github/workflows/scans.yml@87c2db57786c5525a56271a7370075ff0cf20a3d # main
    secrets: inherit
    with:
      project: CDSUMBRELLA

  artifactory:
    needs: [upload-test-results, blackduck-scans, test]
    runs-on: [self-hosted, solinas-medium]
    steps:
      - uses: cap/.github/.github/actions/release@87c2db57786c5525a56271a7370075ff0cf20a3d # main
        with:
          xmake-token: ${{ secrets.XMAKE_TOKEN }}
          xmake-user: ${{ secrets.XMAKE_USER }}
          mode: stage_and_promote
