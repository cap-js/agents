name: Release

on:
  workflow_dispatch:

concurrency:
  group: release-${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  XMAKE_PROJECT_ID: ght-cap-agents
  XMAKE_RELEASE_MODE: stage_and_promote

jobs:
  test:
    runs-on: [self-hosted, solinas]
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        node-version: [20.x, 22.x]
        cds-version: [latest]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm i -g @sap/cds-dk@${{ matrix.cds-version }}
      - run: npm i
      - run: cd tests/samples/bookshop && npm i
      - run: node --experimental-vm-modules node_modules/jest/bin/jest.js

  # Pre-release: upload test results and run BlackDuck scans
  upload-test-results:
    uses: cap/.github/.github/workflows/pre-release.yml@2b736a99c0d55a3cdb44e5f51905b1aa8e304811 # main
    secrets:
      cumulus-token: ${{ secrets.CUMULUS_TOKEN_CDS_UMBRELLA }}
    with:
      # TODO: Replace with actual Cumulus pipeline ID once registered
      cumulus-pipeline-id: "TBD"
      cobertura-file: "coverage/cobertura-coverage.xml"
      junit-file: "junit.xml"
      release-branch: "release"
      npm-script: "test:reporting"

  blackduck-scans:
    uses: cap/.github/.github/workflows/scans.yml@2b736a99c0d55a3cdb44e5f51905b1aa8e304811 # main
    secrets: inherit
    with:
      project: CDSUMBRELLA

  artifactory:
    needs: [upload-test-results, blackduck-scans, test]
    runs-on: [self-hosted, solinas-medium]
    steps:
      - uses: cap/.github/.github/actions/release@2b736a99c0d55a3cdb44e5f51905b1aa8e304811 # main
        with:
          xmake-token: ${{ secrets.XMAKE_TOKEN }}
          xmake-user: ${{ secrets.XMAKE_USER }}
          mode: stage_and_promote
