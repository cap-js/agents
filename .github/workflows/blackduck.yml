name: BlackDuck Scans

on:
  workflow_dispatch:
  schedule:
    # Only run twice a week on default branch (main).
    # BlackDuck has a min-scan-interval of 24h:
    - cron: "40 10 * * 3,5"

jobs:
  scans:
    uses: cap/.github/.github/workflows/scans.yml@f52abfb84ed361d807bc7c3613df7955bc719275 # main
    secrets: inherit
    with:
      project: CDSUMBRELLA
