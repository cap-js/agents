name: BlackDuck Scans

on:
  workflow_dispatch:
  schedule:
    # Only run twice a week on default branch (main).
    # BlackDuck has a min-scan-interval of 24h:
    - cron: "40 10 * * 3,5"

jobs:
  scans:
    uses: cap/.github/.github/workflows/scans.yml@5507e8e09411e392cc3e81bacd6773358c1d6b24 # main
    secrets: inherit
    with:
      project: CDSUMBRELLA
