name: BlackDuck Scans

on:
  workflow_dispatch:
  schedule:
    # Only run twice a week on default branch (main).
    # BlackDuck has a min-scan-interval of 24h:
    - cron: "40 10 * * 3,5"

jobs:
  scans:
    uses: cap/.github/.github/workflows/scans.yml@2b736a99c0d55a3cdb44e5f51905b1aa8e304811 # main
    secrets: inherit
    with:
      project: CDSUMBRELLA
