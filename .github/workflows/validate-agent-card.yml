name: Metadata Validator

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validation:
    name: Agent Card
    runs-on: [self-hosted, solinas]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24
      - name: Configure internal registry
        run: |
          echo "@cap-js:registry=https://int.repositories.cloud.sap/artifactory/api/npm/build-releases-npm/" >> .npmrc
          echo "//int.repositories.cloud.sap/artifactory/api/npm/build-releases-npm/:_authToken=${{ secrets.NPM_REGISTRY_TOKEN }}" >> .npmrc
      - run: npm i -g @sap/cds-dk
      - run: npm i
      - run: cd tests/bookshop && cds compile ./srv -s CatalogService -2 a2a > agent-card.json
      - name: Run API Metadata Validator
        uses: CPA/api-metadata-validator@a95b1d4f6296f97617a4ce0a65fd9c0de5c140e2 # main
        with:
          files: ./tests/bookshop/*-card.json
          verbose: true
          only-changed-files: false
