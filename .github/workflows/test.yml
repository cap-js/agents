name: CI

on:
  workflow_dispatch:
  merge_group:
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    name: Tests with Node.js ${{ matrix.node-version }} (CDS ${{ matrix.cds-version }})
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
        cds-version: [8, 9, latest]
        exclude: ${{ github.event_name == 'merge_group' && fromJSON('[]') || fromJSON('[{"node-version":22,"cds-version":8},{"node-version":22,"cds-version":9},{"node-version":22,"cds-version":"latest"},{"node-version":24,"cds-version":8},{"node-version":24,"cds-version":9}]') }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}

      - name: Pin CDS 9 compatible stack
        if: matrix.cds-version == '9'
        run: |
          npm pkg delete "devDependencies.@cap-js/sqlite"
          npm pkg delete "devDependencies.@sap/cds-mtxs"
          npm pkg set "overrides.@sap/cds=^9" "overrides.@cap-js/sqlite=^2" "overrides.@cap-js/hana=^2" "overrides.@sap/cds-mtxs=^3"
          npm pkg set "dependencies.@sap/cds=^9" --ws
          npm pkg set "peerDependencies.@sap/cds=^9"
          npm pkg set "devDependencies.@cap-js/sqlite=^2"

      - name: Pin CDS 8 compatible stack
        if: matrix.cds-version == '8'
        run: |
          npm pkg set "overrides.@sap/cds=^8"
          npm pkg set "overrides.@cap-js/sqlite=^1"
          npm pkg set "overrides.@cap-js/hana=^1"
          npm pkg set "overrides.@sap/cds-mtxs=^2"
          npm pkg set "overrides.express=^4"
          npm pkg set "overrides.better-sqlite3=^12"
          npm pkg set "devDependencies.@cap-js/cds-test=>0"
          npm pkg set "peerDependencies.@sap/cds=^8"
          npm pkg delete "devDependencies.@cap-js/hana"
          npm pkg delete "devDependencies.@cap-js/sqlite"
          npm pkg delete "devDependencies.@sap/cds-mtxs"

      - run: npm i -g @sap/cds-dk@${{ matrix.cds-version }}
      - run: npm i --legacy-peer-deps
      - run: cds v -i
      - run: npm run test

  test-hybrid:
    runs-on: ubuntu-latest
    name: Hybrid Tests with Node.js ${{ matrix.node-version }}
    strategy:
      fail-fast: false
      matrix:
        node-version: [24]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}

      - name: Setup CF CLI and authenticate
        uses: cap-js/cf-setup@d9f989795c045b8ba9f80103ae4979de71131844 # v2
        with:
          api: ${{ secrets.CF_API }}
          org: ${{ secrets.CF_ORG }}
          space: ${{ secrets.CF_SPACE }}
          username: ${{ secrets.CF_USERNAME }}
          password: ${{ secrets.CF_PASSWORD }}

      - run: npm i -g @sap/cds-dk@latest
      - run: npm i
      - run: cds v -i
      - run: cds bind -2 joule-cap-proxy -o package.json
      - run: npm run test:hybrid

  summary:
    if: always()
    runs-on: ubuntu-latest
    name: Summary
    needs: [test, test-hybrid]
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
