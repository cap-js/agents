name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request_target:
    branches: [main]

jobs:
  test:
    runs-on: [self-hosted, solinas]
    timeout-minutes: 10
    name: SQLite Tests with Node.js ${{ matrix.node-version }} (CDS ${{ matrix.cds-version }})
    strategy:
      fail-fast: false
      matrix:
        node-version: [22.x, 24.x]
        cds-version: [8, 9, latest]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          allow-unsafe-pr-checkout: true
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
      - name: Configure internal registry
        run: |
          echo "@cap-js:registry=https://int.repositories.cloud.sap/artifactory/api/npm/build-releases-npm/" >> .npmrc
          echo "//int.repositories.cloud.sap/artifactory/api/npm/build-releases-npm/:_authToken=${{ secrets.NPM_REGISTRY_TOKEN }}" >> .npmrc
      - name: Pin CDS 8 compatible stack
        if: matrix.cds-version == '8'
        run: |
          npm pkg set "overrides.@sap/cds=^8"
          npm pkg set "overrides.@cap-js/sqlite=^1"
          npm pkg set "overrides.@cap-js/hana=^1"
          npm pkg set "overrides.@sap/cds-mtxs=^2"
          npm pkg set "overrides.express=^4"
          npm pkg set "devDependencies.@cap-js/cds-test=>0"
          npm pkg delete "devDependencies.@cap-js/hana"
          npm pkg delete "devDependencies.@cap-js/sqlite"
          npm pkg delete "devDependencies.@sap/cds-mtxs"
      - name: Pin CDS 9 compatible stack
        if: matrix.cds-version == '9'
        run: |
          npm pkg delete "devDependencies.@cap-js/sqlite"
          npm pkg set "overrides.@sap/cds=^9" "overrides.@cap-js/sqlite=^2" "overrides.@cap-js/hana=^2" "overrides.@sap/cds-mtxs=^3"
          npm pkg set "dependencies.@sap/cds=^9" --ws
          npm pkg set "peerDependencies.@sap/cds=^9"
          npm pkg set "devDependencies.@cap-js/sqlite=^2"
      - run: npm i -g @sap/cds-dk@${{ matrix.cds-version }}
      - run: npm i --legacy-peer-deps
      - run: cds v
      - run: npm run test

  test-hybrid:
    runs-on: [self-hosted, solinas-medium]
    container:
      image: public.int.repositories.cloud.sap/ubuntu:24.04@sha256:4fbb8e6a8395de5a7550b33509421a2bafbc0aab6c06ba2cef9ebffbc7092d90
    name: Hybrid Tests with Node.js ${{ matrix.node-version }}
    strategy:
      fail-fast: false
      matrix:
        node-version: [22.x, 24.x]
    env:
      CF_USERNAME: ${{ secrets.CF_USERNAME }}
      CF_PASSWORD: ${{ secrets.CF_PASSWORD }}
    steps:
      - run: apt-get update -y && apt-get install make -y
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          allow-unsafe-pr-checkout: true
      - uses: cap/.github/.github/actions/git-setup@5507e8e09411e392cc3e81bacd6773358c1d6b24 # main
        with:
          com-github-token: ${{ secrets.COM_GITHUB_TOKEN }}
      - name: Run hybrid integration tests
        uses: ./.github/actions/integration-tests
        with:
          CF_ORG: ${{ secrets.CF_ORG }}
          CF_SPACE: ${{ secrets.CF_SPACE }}
          NODE_VERSION: ${{ matrix.node-version }}
          CDS_VERSION: latest
          NPM_REGISTRY_TOKEN: ${{ secrets.NPM_REGISTRY_TOKEN }}
