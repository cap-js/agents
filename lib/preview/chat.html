<!doctype html>
<html>
  <head>
    <title>{{agentName}}</title>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="dark light" />
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family:
          Avenir Next,
          sans-serif;
        background: #f8fbff;
        color: #2a3d52;
        display: flex;
        flex-direction: column;
        height: 100dvh;
      }

      header {
        background: #537492;
        color: #fff;
        padding: 12px 20px;
        display: flex;
        align-items: center;
        gap: 12px;
        flex-shrink: 0;
      }
      header h1 {
        font-size: 1rem;
        font-weight: 500;
      }
      header .back {
        color: #c8def0;
        text-decoration: none;
        font-size: 0.85rem;
        cursor: pointer;
      }
      header .back:hover {
        color: #fff;
      }
      header .status-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #4caf50;
        margin-left: auto;
        flex-shrink: 0;
        transition: background 0.3s;
      }
      header .status-dot.busy {
        background: #f9a825;
      }
      header .status-dot.error {
        background: #e53935;
      }

      #messages {
        flex: 1;
        overflow-y: auto;
        padding: 20px;
        display: flex;
        flex-direction: column;
        gap: 14px;
      }

      .msg {
        max-width: 75%;
        padding: 10px 14px;
        border-radius: 12px;
        line-height: 1.5;
        font-size: 0.9rem;
        word-break: break-word;
      }
      .msg.user {
        align-self: flex-end;
        background: #537492;
        color: #fff;
        border-bottom-right-radius: 3px;
        white-space: pre-wrap;
      }
      .msg.agent {
        align-self: flex-start;
        background: #d0e9ff;
        color: #1d3e5a;
        border-bottom-left-radius: 3px;
      }
      .msg.error {
        align-self: flex-start;
        background: #fde8e8;
        color: #b71c1c;
        border-bottom-left-radius: 3px;
        white-space: pre-wrap;
      }
      .msg.approval {
        align-self: flex-start;
        background: #d0e9ff;
        color: #1d3e5a;
        border-bottom-left-radius: 3px;
        border-left: 3px solid #537492;
      }
      .msg.approval::before {
        content: "Action Required";
        display: block;
        font-size: 0.75rem;
        font-weight: 600;
        color: #537492;
        margin-bottom: 6px;
        letter-spacing: 0.03em;
        text-transform: uppercase;
      }

      .msg.agent p {
        margin: 0 0 6px;
      }
      .msg.agent p:last-child {
        margin-bottom: 0;
      }
      .msg.agent h1,
      .msg.agent h2,
      .msg.agent h3 {
        font-weight: 600;
        margin: 8px 0 4px;
      }
      .msg.agent h1 {
        font-size: 1.1em;
      }
      .msg.agent h2 {
        font-size: 1em;
      }
      .msg.agent h3 {
        font-size: 0.95em;
      }
      .msg.agent ul,
      .msg.agent ol {
        margin: 4px 0 6px 18px;
        padding: 0;
      }
      .msg.agent li {
        margin-bottom: 2px;
      }
      .msg.agent pre {
        background: rgba(0, 0, 0, 0.08);
        border-radius: 6px;
        padding: 8px 10px;
        overflow-x: auto;
        margin: 6px 0;
        white-space: pre;
      }
      .msg.agent code {
        font-family: ui-monospace, "Cascadia Code", monospace;
        font-size: 0.85em;
        background: rgba(0, 0, 0, 0.08);
        padding: 1px 4px;
        border-radius: 3px;
      }
      .msg.agent pre code {
        background: none;
        padding: 0;
        font-size: 0.82em;
      }
      .msg.agent a {
        color: inherit;
        text-decoration: underline;
      }
      .msg.agent hr {
        border: none;
        border-top: 1px solid rgba(0, 0, 0, 0.15);
        margin: 8px 0;
      }

      .typing {
        align-self: flex-start;
        padding: 10px 16px;
        background: #d0e9ff;
        border-radius: 12px;
        border-bottom-left-radius: 3px;
        display: none;
      }
      .typing span {
        display: inline-block;
        width: 7px;
        height: 7px;
        background: #537492;
        border-radius: 50%;
        animation: bounce 1.2s infinite;
      }
      .typing span:nth-child(2) {
        animation-delay: 0.2s;
      }
      .typing span:nth-child(3) {
        animation-delay: 0.4s;
      }
      @keyframes bounce {
        0%,
        80%,
        100% {
          transform: translateY(0);
        }
        40% {
          transform: translateY(-6px);
        }
      }

      #input-row {
        display: flex;
        gap: 10px;
        padding: 14px 20px;
        border-top: 1px solid #c8d9e8;
        background: #f8fbff;
        flex-shrink: 0;
      }

      #prompt {
        flex: 1;
        padding: 10px 14px;
        border: 1px solid #91adc5;
        border-radius: 8px;
        font-family: inherit;
        font-size: 0.9rem;
        resize: none;
        outline: none;
        background: #fff;
        color: inherit;
        line-height: 1.4;
        max-height: 140px;
        overflow-y: auto;
      }
      #prompt:focus {
        border-color: #537492;
      }

      #send {
        align-self: flex-end;
        padding: 10px 20px;
        background: #537492;
        color: #fff;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        font-family: inherit;
        font-size: 0.9rem;
        transition: background 0.15s;
      }
      #send:hover:not(:disabled) {
        background: #3e5a73;
      }
      #send:disabled {
        background: #91adc5;
        cursor: not-allowed;
      }

      .approval-actions {
        display: flex;
        gap: 8px;
        margin-top: 10px;
      }
      .approval-actions button {
        padding: 7px 18px;
        border: none;
        border-radius: 7px;
        cursor: pointer;
        font-family: inherit;
        font-size: 0.85rem;
        font-weight: 500;
        transition: background 0.15s;
      }
      .btn-approve {
        background: #537492;
        color: #fff;
      }
      .btn-approve:hover {
        background: #3e5a73;
      }
      .btn-reject {
        background: transparent;
        color: #537492;
        border: 1px solid #91adc5;
      }
      .btn-reject:hover {
        background: #c8d9e8;
      }

      @media (prefers-color-scheme: dark) {
        body {
          background: #0a2138;
          color: #c8dff0;
        }
        header {
          background: #304c65;
        }
        #input-row {
          background: #0a2138;
          border-color: #2a4a63;
        }
        #prompt {
          background: #0f2d45;
          border-color: #2a4a63;
          color: #c8dff0;
        }
        #prompt:focus {
          border-color: #537492;
        }
        .msg.agent {
          background: #1a3d58;
          color: #c8dff0;
        }
        .msg.user {
          background: #537492;
        }
        .msg.error {
          background: #3b1818;
          color: #ff8a80;
        }
        .typing {
          background: #1a3d58;
        }
        .typing span {
          background: #91adc5;
        }
        #send {
          background: #537492;
        }
        #send:hover:not(:disabled) {
          background: #6a8fa8;
        }
        #send:disabled {
          background: #304c65;
        }
        .msg.approval {
          background: #1a3d58;
          color: #c8dff0;
          border-left-color: #91adc5;
        }
        .msg.approval::before {
          color: #91adc5;
        }
        .btn-approve {
          background: #537492;
        }
        .btn-approve:hover {
          background: #6a8fa8;
        }
        .btn-reject {
          color: #c8dff0;
          border-color: #2a4a63;
        }
        .btn-reject:hover {
          background: #0f2d45;
        }
      }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  </head>
  <body>
    <header>
      <a class="back" id="back" title="Back to index">&#8592;</a>
      <h1>{{agentName}}</h1>
      <div class="status-dot" id="dot"></div>
    </header>

    <div id="messages">
      <div class="typing" id="typing"><span></span><span></span><span></span></div>
    </div>

    <div id="input-row">
      <textarea id="prompt" rows="1" placeholder="Message {{agentName}}…" autofocus></textarea>
      <button id="send">Send</button>
    </div>

    <script>
      const AGENT_URL = window.location.pathname.replace(/\/preview$/, "") + "/"
      document.getElementById("back").addEventListener("click", () => history.back())
      const messages = document.getElementById("messages")
      const typing = document.getElementById("typing")
      const prompt = document.getElementById("prompt")
      const sendBtn = document.getElementById("send")
      const dot = document.getElementById("dot")

      let busy = false
      let contextId = null
      let pendingTaskId = null

      const md = (text) => marked.parse(text, { breaks: true, gfm: true })

      prompt.addEventListener("input", () => {
        prompt.style.height = "auto"
        prompt.style.height = Math.min(prompt.scrollHeight, 140) + "px"
      })
      prompt.addEventListener("keydown", (e) => {
        if (e.key === "Enter" && !e.shiftKey) {
          e.preventDefault()
          send()
        }
      })
      sendBtn.addEventListener("click", send)

      function addMessage(role, text) {
        const el = document.createElement("div")
        el.className = "msg " + role
        if (role === "agent") el.innerHTML = md(text, { sanitize: true })
        else el.textContent = text
        messages.insertBefore(el, typing)
        messages.scrollTop = messages.scrollHeight
        return el
      }

      function addApprovalPrompt(description) {
        const el = document.createElement("div")
        el.className = "msg approval"
        el.innerHTML = md(description || "The agent requires your approval to continue.")
        const actions = document.createElement("div")
        actions.className = "approval-actions"

        const approveBtn = document.createElement("button")
        approveBtn.className = "btn-approve"
        approveBtn.textContent = "Approve"
        approveBtn.addEventListener("click", () => {
          removeApprovalPrompt(el)
          resume("approve")
        })

        const rejectBtn = document.createElement("button")
        rejectBtn.className = "btn-reject"
        rejectBtn.textContent = "Reject"
        rejectBtn.addEventListener("click", () => {
          removeApprovalPrompt(el)
          resume("reject")
        })

        actions.appendChild(approveBtn)
        actions.appendChild(rejectBtn)
        el.appendChild(actions)
        messages.insertBefore(el, typing)
        messages.scrollTop = messages.scrollHeight
        return el
      }

      function removeApprovalPrompt(el) {
        el.remove()
      }

      function setBusy(val) {
        busy = val
        sendBtn.disabled = val
        prompt.disabled = val
        typing.style.display = val ? "block" : "none"
        dot.className = "status-dot" + (val ? " busy" : "")
        messages.scrollTop = messages.scrollHeight
      }

      async function resume(decision) {
        const taskId = pendingTaskId
        pendingTaskId = null

        setBusy(true)

        try {
          const resp = await fetch(AGENT_URL, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              jsonrpc: "2.0",
              method: "message/send",
              id: crypto.randomUUID(),
              params: {
                message: {
                  role: "user",
                  messageId: crypto.randomUUID(),
                  taskId,
                  contextId,
                  parts: [{ kind: "text", text: decision }],
                },
              },
            }),
          })

          const { result, error } = await resp.json()
          if (error) throw new Error(error.message || JSON.stringify(error))

          contextId = result?.contextId ?? result?.status?.contextId ?? contextId
          await handleResult(result)
        } catch (err) {
          dot.className = "status-dot error"
          addMessage("error", "⚠ " + (err.message || String(err)))
          setTimeout(() => (dot.className = "status-dot"), 3000)
        } finally {
          setBusy(false)
          prompt.focus()
        }
      }

      async function handleResult(result) {
        const state = result?.status?.state ?? result?.state
        const taskId = result?.id ?? result?.taskId

        if (state === "input-required") {
          pendingTaskId = taskId
          const msgParts = result?.status?.message?.parts ?? []
          const description = msgParts
            .filter((p) => p.kind === "text" || p.text)
            .map((p) => p.text)
            .join("")
          addApprovalPrompt(description)
          return
        }

        const parts = result?.parts ?? result?.artifacts?.[0]?.parts ?? []
        const reply = parts
          .filter((p) => p.kind === "text" || p.text)
          .map((p) => p.text)
          .join("")
        addMessage("agent", reply || "(no response)")
      }

      async function send() {
        const text = prompt.value.trim()
        if (!text || busy) return

        addMessage("user", text)
        prompt.value = ""
        prompt.style.height = "auto"
        setBusy(true)

        try {
          const resp = await fetch(AGENT_URL, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              jsonrpc: "2.0",
              method: "message/send",
              id: crypto.randomUUID(),
              params: {
                message: {
                  role: "user",
                  messageId: crypto.randomUUID(),
                  ...(contextId ? { contextId } : {}),
                  parts: [{ kind: "text", text }],
                },
              },
            }),
          })

          const { result, error } = await resp.json()
          if (error) throw new Error(error.message || JSON.stringify(error))

          contextId = result?.contextId ?? result?.status?.contextId ?? contextId
          await handleResult(result)
        } catch (err) {
          dot.className = "status-dot error"
          addMessage("error", "⚠ " + (err.message || String(err)))
          setTimeout(() => {
            dot.className = "status-dot"
          }, 3000)
        } finally {
          setBusy(false)
          prompt.focus()
        }
      }
    </script>
  </body>
</html>
